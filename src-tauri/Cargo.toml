# Workspace: the Tauri host crate (`lantern`, this manifest) plus the in-house
# OOXML document engine (`crates/lantern-docx`). Keeping the engine as a
# workspace member — not a root-level workspace over the whole repo — means
# `cargo test -p lantern-docx` runs fast and isolated (no tauri/lancedb/
# fastembed in its graph) while sharing one lockfile and one (gitignored)
# target/ dir with the host. The host depends on the engine via a path dep.
[workspace]
members = [".", "crates/lantern-docx", "crates/lantern-vault"]

[package]
name = "lantern"
version = "3.3.5"
description = "The private intelligence layer for a financial advisory practice"
authors = ["Advisor Prep Hero"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Required when a crate ships multiple binaries (lantern + lantern-mcp)
# so `tauri build` and plain `cargo run` know which main binary to use.
default-run = "lantern"

[lib]
name = "lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Lantern MCP server (M4, v1.5). Hand-rolled JSON-RPC 2.0 server over stdio
# that exposes the workspace (list / read / search / write / memory facts) to
# any MCP-compatible client — Claude Desktop, Cursor, Zed, etc. The binary
# lives in its own sub-folder so its helper modules (`protocol`, `tools`,
# `approval`) can be split across files the way the Tauri host already does.
[[bin]]
name = "lantern-mcp"
path = "src/mcp_bin/main.rs"

# Model prefetch helper: downloads the e5-small ONNX model into
# resources/embeddings/ so the Tauri installer can bundle it offline.
# Run from src-tauri/ before `tauri build`:  cargo run --bin prefetch_model
# CI runs this in every build job (see .github/workflows/release.yml).
[[bin]]
name = "prefetch_model"
path = "src/bin/prefetch_model.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# WS-A document engine. In-house OOXML (.docx) parse/serialize/package with
# track-changes + comments + preserve-by-default. The `commands::docx` module
# is a thin wrapper over this crate; all the real work lives here so it can be
# tested in isolation. See crates/lantern-docx/.
lantern-docx = { path = "crates/lantern-docx" }
lantern-vault = { path = "crates/lantern-vault" }
zeroize = "1"
cpal = "0.15"
# 0.6 uses the maintained objc2 bindings on macOS. The older 0.5 line pulls
# apple-sys, whose generated bindings fail with current Xcode/macOS SDKs.
keepawake = "0.6"
# Wave 3a (meeting capture) and Wave 4 Track A (diarization) both read/write
# WAV — 3.5 satisfies both (a superset of the plain "3" Wave 3a needs).
hound = "3.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# voice.rs / sidecars/parakeet.rs need a real temp file at runtime (the real
# whisper.cpp engine has no stdin mode — see parakeet.rs's doc comment), not
# just in tests, so this is a real (not dev-)dependency. Already transitively
# in the lock via lancedb + fastembed, so this adds no new build-time weight.
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Wave 1 calendar connector — TZID/DST-correct ICS + Graph timezone-name expansion.
chrono-tz = "0.10"
log = "0.4"
tauri = { version = "~2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-http = "=2.5.9"
dirs = "5"
# Local LLM first-run download: preflight free disk space before fetching a
# multi-GB GGUF model.
fs2 = "0.4"

# Phase 2 (v1.5) — Rust/Tauri foundation. These four crates unlock the
# Mediums and Quick Wins in Phases 3 and 4:
#   - reqwest : Ollama streaming (M6/Q7) + URL title fetch (Q12)
#   - tokio   : async runtime for all new #[tauri::command] async fns
#   - notify  : workspace file watcher feeding incremental RAG (M1)
#   - keyring : native OS keychain (replaces the encrypted-file fallback
#               for API-key storage on desktop builds)
#
# Phase 3 M1 (v1.5) — Local RAG. lancedb + fastembed-rs + the underlying
# arrow crates land here. Together they add ~500MB of compile output and
# several minutes of compile time, but they are required for the Memory
# feature (Flag 1: "the AI workspace that remembers your stuff"). They are
# pinned to versions known to work on Tauri 2.9 / Rust 1.78+:
#   - lancedb 0.21    — vector store; rust-version 1.78
#   - fastembed 4     — local ONNX embeddings via ort; bundles e5-small
#   - arrow-array 55  — must match lancedb 0.21's transitive arrow dep so
#                       users building tables don't see the "two arrow
#                       versions" error from cargo. Pin explicitly to keep
#                       upgrades across the workspace coherent.
#   - arrow-schema 55 — same reasoning.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
# `futures-util::StreamExt` powers the chunked body reader in `fetch_url_title`
# (we want to bail as soon as we see `</title>` rather than reading the full
# body). `reqwest`'s response stream uses the same `Stream` trait. M1 RAG
# also uses it to consume the LanceDB query stream.
futures-util = "0.3"
notify = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lancedb = "0.21"
fastembed = "4"
# WS3d-B — pure-Rust BM25 keyword scorer for hybrid (keyword + vector) retrieval.
# Default features only (`default_tokenizer`); no language detection / rayon.
bm25 = "2.3.2"
# Direct dep on the SAME hf-hub fastembed uses (same version + features, so
# nothing new compiles). Gives us download_with_progress + the Cache lookup
# for the visible first-run model download (Option B).
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "native-tls"] }
arrow-array = "55"
arrow-schema = "55"
# Stable hash for chunk ids (path + paragraph_index). std::hash defaults
# don't guarantee cross-version stability, so use a known-good algorithm.
sha2 = "0.10"
# VG-6e — deterministic keyed path tokens for the vector store's queryable
# path/source_id columns (rag/crypto.rs::path_token). Pairs with the existing
# sha2 pin (hmac 0.12 sits on the same digest 0.10 generation).
hmac = "0.12"
# WalkDir for file walking in rag_index_workspace. Lighter than std::fs
# recursion + handles symlinks correctly.
walkdir = "2"
# Async stream consumption for LanceDB query results.
async-stream = "0.3"
# Ergonomic error contexts for the M1 RAG indexer (chunker / embedder /
# store all use `?` against heterogeneous error types).
anyhow = "1"
async-trait = "0.1"
# Lantern-Plus Wave 2 (CRM write-back) — typed error taxonomy for
# CrmWriteError (commands/crm/write.rs). Already resolved transitively
# (thiserror 2.0.18 via other crates), so declaring it direct adds no new
# major version to the tree.
thiserror = "2"
# Stream B TTS — voice archive download and extraction.
# Stream C1 (Templates Marketplace) — also reuses flate2 + tar for tarball
# extraction and adds `hex` for the SHA-256 file checksum command.
flate2 = "1"
tar = "0.4"
hex = "0.4"
# P2.1 (Finding 5): bounded LRU for the query-embedding cache. 0.12.x is already
# resolved transitively (via lancedb), so declaring it direct adds no new crate.
lru = "0.12"
# Mail import (M365 Phase 1) — SQLite metadata store tracking imported message ids,
# on-disk paths, and per-folder delta-sync cursors. `bundled` compiles SQLite
# from source so there is no runtime dependency on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
aes-gcm = "0.10"
rand = "0.8"
# Mail import — RFC822 parser used by the IMAP normalizer.
mail-parser = "0.11"
encoding_rs = "0.8"
# SMTP send — async transport (STARTTLS, port 587) + RFC822 message builder.
# Used by the IMAP/SMTP send path (imap/send.rs) and the Gmail raw-RFC822
# path (gmail/api.rs). M365 uses the Graph REST API (no lettre needed there).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }
# IMAP client (email/gmail-imap-multiprovider).
# runtime-tokio enables the tokio AsyncRead/AsyncWrite impls; default-features=false
# drops the async-std dep.  TLS is provided by tokio-native-tls + native-tls.
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
# Gmail OAuth (loopback + PKCE). base64 for base64url-nopad PKCE challenge;
# open for launching the system browser to the Google auth URL.
base64 = "0.22"
open = "5"
# VG-2b office extraction (`commands/rag/office.rs`): .xlsx/.pptx are OOXML
# ZIPs of XML parts; .rtf is a plain byte stream. Same crates at the SAME
# versions lantern-docx already pins (crates/lantern-docx/Cargo.toml) so
# the lockfile gains zero new packages — the in-house OOXML philosophy
# ("only generic XML/ZIP/serde crates"; calamine rejected in planning).
zip = "4"
quick-xml = "0.41"

# Auto-updater. Desktop-only — Tauri mobile builds skip these targets so
# the cfg() filter keeps the iOS/Android crate graph slim.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"

# Windows-only: ShellExecuteW, the canonical way to open a URL in the default
# browser (BUG-010). `rundll32 url.dll,FileProtocolHandler` silently fails to
# launch some default browsers, and `cmd /C start` mangles `&`/`%` in OAuth
# URLs (the `&` is read as a command separator). ShellExecuteW passes the URL as
# a real wide-string argument with no shell parsing, so the OAuth URL stays intact.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem"] }
# macOS-only: MacTapSource (capture::sources) sends SIGTERM to the
# capture-mac sidecar for a graceful stop per its documented contract.
[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "~2.11.3", features = ["test"] }
tokio = { version = "1", features = ["full", "test-util"] }
# `tempfile` moved to [dependencies] above (voice.rs needs it outside tests
# too now) — it's still available here for dev/test code, just not
# re-declared.
# HTTP mock server for M365 Graph API integration tests (added here so it compiles
# alongside rusqlite in one pass rather than requiring a second dep-compile later).
wiremock = "0.6"
# Unix-only (see tests/capture_enospc.rs's `#![cfg(unix)]`): setrlimit(2) +
# SIGXFSZ-ignore is how that test forces a REAL OS-level write failure
# (EFBIG, same code path a real ENOSPC hits) to prove QA-35's chunk-writer
# behavior without needing root/mount privileges for a real quota'd
# filesystem. The main [target.cfg(macos)] libc dependency above is a
# separate, narrower macOS-only use (MacTapSource's SIGTERM) — this one is a
# plain dev-dependency so it resolves for `cargo test` on any unix host.
libc = "0.2"
