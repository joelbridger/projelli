[package]
name = "projelli"
version = "1.0.7"
description = "Local-first workspace for solo founders building businesses with AI assistance"
authors = ["Projelli Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "projelli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
dirs = "5"

# Auto-updater. Desktop-only — Tauri mobile builds skip these targets so
# the cfg() filter keeps the iOS/Android crate graph slim.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
