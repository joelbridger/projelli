# Workspace: the Tauri host crate (`keepance`, this manifest) plus the in-house
# OOXML document engine (`crates/keepance-docx`). Keeping the engine as a
# workspace member — not a root-level workspace over the whole repo — means
# `cargo test -p keepance-docx` runs fast and isolated (no tauri/lancedb/
# fastembed in its graph) while sharing one lockfile and one (gitignored)
# target/ dir with the host. The host depends on the engine via a path dep.
[workspace]
members = [".", "crates/keepance-docx", "crates/keepance-vault"]

[package]
name = "keepance"
version = "3.2.0"
description = "Local-first AI workspace for confidential client work"
authors = ["Keepance"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Required when a crate ships multiple binaries (keepance + keepance-mcp)
# so `tauri build` and plain `cargo run` know which main binary to use.
default-run = "keepance"

[lib]
name = "keepance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keepance MCP server (M4, v1.5). Hand-rolled JSON-RPC 2.0 server over stdio
# that exposes the workspace (list / read / search / write / memory facts) to
# any MCP-compatible client — Claude Desktop, Cursor, Zed, etc. The binary
# lives in its own sub-folder so its helper modules (`protocol`, `tools`,
# `approval`) can be split across files the way the Tauri host already does.
[[bin]]
name = "keepance-mcp"
path = "src/mcp_bin/main.rs"

# Model prefetch helper: downloads the e5-small ONNX model into
# resources/embeddings/ so the Tauri installer can bundle it offline.
# Run from src-tauri/ before `tauri build`:  cargo run --bin prefetch_model
# CI runs this in every build job (see .github/workflows/release.yml).
[[bin]]
name = "prefetch_model"
path = "src/bin/prefetch_model.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# WS-A document engine. In-house OOXML (.docx) parse/serialize/package with
# track-changes + comments + preserve-by-default. The `commands::docx` module
# is a thin wrapper over this crate; all the real work lives here so it can be
# tested in isolation. See crates/keepance-docx/.
keepance-docx = { path = "crates/keepance-docx" }
keepance-vault = { path = "crates/keepance-vault" }
zeroize = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
dirs = "5"

# Phase 2 (v1.5) — Rust/Tauri foundation. These four crates unlock the
# Mediums and Quick Wins in Phases 3 and 4:
#   - reqwest : Ollama streaming (M6/Q7) + URL title fetch (Q12)
#   - tokio   : async runtime for all new #[tauri::command] async fns
#   - notify  : workspace file watcher feeding incremental RAG (M1)
#   - keyring : native OS keychain (replaces the encrypted-file fallback
#               for API-key storage on desktop builds)
#
# Phase 3 M1 (v1.5) — Local RAG. lancedb + fastembed-rs + the underlying
# arrow crates land here. Together they add ~500MB of compile output and
# several minutes of compile time, but they are required for the Memory
# feature (Flag 1: "the AI workspace that remembers your stuff"). They are
# pinned to versions known to work on Tauri 2.9 / Rust 1.78+:
#   - lancedb 0.21    — vector store; rust-version 1.78
#   - fastembed 4     — local ONNX embeddings via ort; bundles e5-small
#   - arrow-array 55  — must match lancedb 0.21's transitive arrow dep so
#                       users building tables don't see the "two arrow
#                       versions" error from cargo. Pin explicitly to keep
#                       upgrades across the workspace coherent.
#   - arrow-schema 55 — same reasoning.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
# `futures-util::StreamExt` powers the chunked body reader in `fetch_url_title`
# (we want to bail as soon as we see `</title>` rather than reading the full
# body). `reqwest`'s response stream uses the same `Stream` trait. M1 RAG
# also uses it to consume the LanceDB query stream.
futures-util = "0.3"
notify = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lancedb = "0.21"
fastembed = "4"
# Direct dep on the SAME hf-hub fastembed uses (same version + features, so
# nothing new compiles). Gives us download_with_progress + the Cache lookup
# for the visible first-run model download (Option B).
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "native-tls"] }
arrow-array = "55"
arrow-schema = "55"
# Stable hash for chunk ids (path + paragraph_index). std::hash defaults
# don't guarantee cross-version stability, so use a known-good algorithm.
sha2 = "0.10"
# VG-6e — deterministic keyed path tokens for the vector store's queryable
# path/source_id columns (rag/crypto.rs::path_token). Pairs with the existing
# sha2 pin (hmac 0.12 sits on the same digest 0.10 generation).
hmac = "0.12"
# WalkDir for file walking in rag_index_workspace. Lighter than std::fs
# recursion + handles symlinks correctly.
walkdir = "2"
# Async stream consumption for LanceDB query results.
async-stream = "0.3"
# Ergonomic error contexts for the M1 RAG indexer (chunker / embedder /
# store all use `?` against heterogeneous error types).
anyhow = "1"
async-trait = "0.1"
# Stream B TTS — voice archive download and extraction.
# Stream C1 (Templates Marketplace) — also reuses flate2 + tar for tarball
# extraction and adds `hex` for the SHA-256 file checksum command.
flate2 = "1"
tar = "0.4"
hex = "0.4"
# Mail import (M365 Phase 1) — SQLite metadata store tracking imported message ids,
# on-disk paths, and per-folder delta-sync cursors. `bundled` compiles SQLite
# from source so there is no runtime dependency on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
aes-gcm = "0.10"
rand = "0.8"
# Mail import — RFC822 parser used by the IMAP normalizer.
mail-parser = "0.11"
# IMAP client (email/gmail-imap-multiprovider).
# runtime-tokio enables the tokio AsyncRead/AsyncWrite impls; default-features=false
# drops the async-std dep.  TLS is provided by tokio-native-tls + native-tls.
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
# Gmail OAuth (loopback + PKCE). base64 for base64url-nopad PKCE challenge;
# open for launching the system browser to the Google auth URL.
base64 = "0.22"
open = "5"
# VG-2b office extraction (`commands/rag/office.rs`): .xlsx/.pptx are OOXML
# ZIPs of XML parts; .rtf is a plain byte stream. Same crates at the SAME
# versions keepance-docx already pins (crates/keepance-docx/Cargo.toml) so
# the lockfile gains zero new packages — the in-house OOXML philosophy
# ("only generic XML/ZIP/serde crates"; calamine rejected in planning).
zip = "4"
quick-xml = "0.38"

# Auto-updater. Desktop-only — Tauri mobile builds skip these targets so
# the cfg() filter keeps the iOS/Android crate graph slim.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# Integration tests for the `keepance-mcp` sidecar need a throwaway workspace
# dir per test; `tempfile` is the de-facto standard and already transitively
# in the lock via `lancedb` + `fastembed`, so no new build-time weight.
tempfile = "3"
# HTTP mock server for M365 Graph API integration tests (added here so it compiles
# alongside rusqlite in one pass rather than requiring a second dep-compile later).
wiremock = "0.6"
