# cargo-deny policy for Keepance (PROPRIETARY desktop app).
#
# Purpose: a CI gate that fails the build if a dependency introduces
#   (1) a license that is unsafe to ship inside a closed-source product
#       (notably strong copyleft like GPL/AGPL), or
#   (2) a known security vulnerability (RUSTSEC advisory) or a yanked crate.
#
# Run locally from `src-tauri/`:   cargo deny check advisories licenses sources bans
# CI runs the same command on every PR (see ../.github/workflows/ci.yml).
#
# This file was generated from `cargo deny init` and then TUNED to Keepance's
# real, fully-resolved dependency tree (986 crates.io packages, all targets).
# Schema verified against cargo-deny 0.19.x.

# ---------------------------------------------------------------------------
# Dependency graph
# ---------------------------------------------------------------------------
# Leave `targets` empty so the policy is enforced across EVERY platform
# Keepance ships (Windows, macOS, Linux) and every transitive target. This is
# the conservative choice for a license gate: a copyleft crate that is only
# pulled in on one OS is still caught.
[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories  (cargo deny check advisories)
# ---------------------------------------------------------------------------
# Severity levels in the v2 advisories schema are fixed, not configurable:
#   * vulnerability / unsound  -> ERROR  (fails CI)  <- this is the security gate
#   * unmaintained / notice    -> WARNING (does not fail CI)
# We additionally fail on yanked crates so a pulled-from-crates.io version can
# never silently stay in the lockfile.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail the build if any dependency version has been yanked from crates.io.
yanked = "deny"
# Unmaintained advisories: only flag them for OUR OWN workspace crates, not for
# the deep transitive ecosystem. The Linux Tauri/webkit stack (gtk-rs GTK3
# bindings, paste, proc-macro-error, ...) and arrow/lance stack (fxhash,
# number_prefix, unic-*) pull in several crates RustSec marks "unmaintained"
# with no reachable upgrade. Those are informational, not security holes, and
# must not block shipping — so we don't deny on them. Vulnerabilities and
# unsound advisories (the real security gate) STILL fail the build regardless
# of this setting; this only governs the unmaintained category.
unmaintained = "workspace"
# Advisory IDs to ignore, each with a written reason. Add an entry ONLY for an
# advisory consciously reviewed and accepted (e.g. a vuln in a code path
# Keepance never executes), never casually.
ignore = [
    # --- rustls-webpki 0.101.7, pulled ONLY via the AWS SDK TLS stack ---
    # Chain: rustls-webpki 0.101.7 <- rustls 0.21 <- aws-smithy/aws-sdk-*
    #        <- lance-io <- lancedb. lancedb's AWS code is for REMOTE object
    # stores (S3 / DynamoDB). Keepance is local-first and uses lancedb purely
    # for an on-disk vector index under ~/.keepance; it never opens an S3/
    # DynamoDB connection, so this rustls 0.21 TLS path is never executed and
    # these certificate-validation / CRL-parsing bugs are unreachable. There is
    # no SemVer-compatible fix (0.101 -> 0.103 is a breaking bump); the real fix
    # is lancedb upgrading its aws-sdk past rustls 0.21, or building lancedb
    # without remote-store features. Tracked for removal when either lands.
    # NOTE: the actively-used rustls-webpki 0.103.x copy IS patched (>=0.103.13).
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7 reached only via lancedb's AWS S3/DynamoDB TLS path, which Keepance (local-only vector store) never executes; no SemVer fix until lancedb updates aws-sdk past rustls 0.21" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101.7 reached only via lancedb's AWS S3/DynamoDB TLS path, which Keepance (local-only vector store) never executes; no SemVer fix until lancedb updates aws-sdk past rustls 0.21" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7 reached only via lancedb's AWS S3/DynamoDB TLS path, which Keepance (local-only vector store) never executes; the actively-used 0.103.x copy is patched to >=0.103.13" },
]

# ---------------------------------------------------------------------------
# Licenses  (cargo deny check licenses)
# ---------------------------------------------------------------------------
# cargo-deny is an ALLOW-LIST: any license NOT in `allow` below fails the
# build. That is the whole point of the gate — strong copyleft (GPL-2.0/3.0,
# AGPL, SSPL, LGPL-as-the-only-license, etc.) is intentionally ABSENT and will
# therefore fail CI, forcing a human to evaluate any such new dependency before
# it can ship inside this closed-source app.
#
# Every entry below is a permissive (or public-domain-equivalent) license that
# is ACTUALLY present in Keepance's resolved tree today and is safe to ship in
# a proprietary binary. Two notes on weak copyleft and dual licensing:
#
#   * MPL-2.0 is allowed. It is FILE-LEVEL (weak) copyleft: using or linking
#     the unmodified crates (cssparser, selectors, option-ext, dtoa-short,
#     cssparser-macros) imposes NO obligation to open-source Keepance. Only
#     direct modifications to those specific MPL files would need sharing.
#
#   * Crates dual-licensed as "<permissive> OR <copyleft>" (e.g. self_cell is
#     "Apache-2.0 OR GPL-2.0-only"; r-efi is "MIT OR Apache-2.0 OR
#     LGPL-2.1-or-later") are automatically satisfied via their permissive arm,
#     so they need no exception and pull in no copyleft obligation.
[licenses]
allow = [
    # Permissive — the overwhelming majority of the tree.
    "MIT",
    "MIT-0",                       # MIT No Attribution
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",                        # zero-clause BSD (public-domain-equivalent)
    "Zlib",
    "zlib-acknowledgement",        # fastdivide
    "bzip2-1.0.6",                 # libbz2-rs-sys
    "BSL-1.0",                     # Boost Software License (ryu, xxhash-rust)
    "NCSA",                        # University of Illinois/NCSA (libfuzzer-sys)
    "Unicode-3.0",                 # unicode-ident et al.
    "CDLA-Permissive-2.0",         # webpki-roots (Mozilla CA bundle data)
    # Public-domain dedications — safe to ship.
    "Unlicense",
    "CC0-1.0",
    # Weak / file-level copyleft — safe for a proprietary binary (see note above).
    "MPL-2.0",
]
confidence-threshold = 0.8
# Per-crate license exceptions. Empty by design — prefer upgrading/replacing a
# dep over carving out an exception. Add one only with a clear, reviewed reason.
exceptions = [
    #{ allow = ["..."], crate = "some-crate", reason = "why" },
]
# Don't warn when an allowed license isn't currently matched by any crate. Keeps
# the gate quiet if a permissive dep is feature-gated off on some target while
# still vetting it when it IS pulled in.
unused-allowed-license = "allow"

[licenses.private]
# Keepance's own workspace crates are unpublished; never license-check them.
ignore = true

# ---------------------------------------------------------------------------
# Bans  (cargo deny check bans)
# ---------------------------------------------------------------------------
# No crate is hard-banned today. Duplicate versions are reported as warnings
# (the tree legitimately carries several, e.g. base64 0.13/0.21/0.22) rather
# than failing CI, so this check passes while still surfacing bloat.
[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true
deny = [
    #{ crate = "some-crate", reason = "why it is banned" },
]

# ---------------------------------------------------------------------------
# Sources  (cargo deny check sources)
# ---------------------------------------------------------------------------
# Every external dependency must come from crates.io. Keepance uses no git or
# alternate-registry dependencies (verified: 986/986 external crates are
# crates.io). A new git/unknown-registry source will fail CI — a supply-chain
# guard against an unvetted dependency slipping in.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
