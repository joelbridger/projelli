# cargo-deny policy for Lantern (PROPRIETARY desktop app).
#
# Purpose: a CI gate that fails the build if a dependency introduces
#   (1) a license that is unsafe to ship inside a closed-source product
#       (notably strong copyleft like GPL/AGPL), or
#   (2) a known security vulnerability (RUSTSEC advisory) or a yanked crate.
#
# Run locally from `src-tauri/`:   cargo deny check advisories licenses sources bans
# CI runs the same command on every PR (see ../.github/workflows/ci.yml).
#
# This file was generated from `cargo deny init` and then TUNED to Lantern's
# real, fully-resolved dependency tree (986 crates.io packages, all targets).
# Schema verified against cargo-deny 0.19.x.

# ---------------------------------------------------------------------------
# Dependency graph
# ---------------------------------------------------------------------------
# Leave `targets` empty so the policy is enforced across EVERY platform
# Lantern ships (Windows, macOS, Linux) and every transitive target. This is
# the conservative choice for a license gate: a copyleft crate that is only
# pulled in on one OS is still caught.
[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories  (cargo deny check advisories)
# ---------------------------------------------------------------------------
# Severity levels in the v2 advisories schema are fixed, not configurable:
#   * vulnerability / unsound  -> ERROR  (fails CI)  <- this is the security gate
#   * unmaintained / notice    -> WARNING (does not fail CI)
# We additionally fail on yanked crates so a pulled-from-crates.io version can
# never silently stay in the lockfile.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail the build if any dependency version has been yanked from crates.io.
yanked = "deny"
# Unmaintained advisories: only flag them for OUR OWN workspace crates, not for
# the deep transitive ecosystem. The Linux Tauri/webkit stack (gtk-rs GTK3
# bindings, paste, proc-macro-error, ...) and arrow/lance stack (fxhash,
# number_prefix, unic-*) pull in several crates RustSec marks "unmaintained"
# with no reachable upgrade. Those are informational, not security holes, and
# must not block shipping — so we don't deny on them. Vulnerabilities and
# unsound advisories (the real security gate) STILL fail the build regardless
# of this setting; this only governs the unmaintained category.
unmaintained = "workspace"
# Advisory IDs to ignore, each with a written reason. Add an entry ONLY for an
# advisory consciously reviewed and accepted (e.g. a vuln in a code path
# Lantern never executes), never casually.
ignore = [
    # --- rustls-webpki 0.101.7, pulled ONLY via the AWS SDK TLS stack ---
    # Chain: rustls-webpki 0.101.7 <- rustls 0.21 <- aws-smithy/aws-sdk-*
    #        <- lance-io <- lancedb. lancedb's AWS code is for REMOTE object
    # stores (S3 / DynamoDB). Lantern is local-first and uses lancedb purely
    # for an on-disk vector index under ~/.lantern; it never opens an S3/
    # DynamoDB connection, so this rustls 0.21 TLS path is never executed and
    # these certificate-validation / CRL-parsing bugs are unreachable. There is
    # no SemVer-compatible fix (0.101 -> 0.103 is a breaking bump); the real fix
    # is lancedb upgrading its aws-sdk past rustls 0.21, or building lancedb
    # without remote-store features. Tracked for removal when either lands.
    # NOTE: the actively-used rustls-webpki 0.103.x copy IS patched (>=0.103.13).
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7 reached only via lancedb's AWS S3/DynamoDB TLS path, which Lantern (local-only vector store) never executes; no SemVer fix until lancedb updates aws-sdk past rustls 0.21. OWNER: Lantern maintainer (Jameson Daines). REVISIT: 2026-10-19 — re-check whether lancedb has moved its aws-sdk past rustls 0.21." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101.7 reached only via lancedb's AWS S3/DynamoDB TLS path, which Lantern (local-only vector store) never executes; no SemVer fix until lancedb updates aws-sdk past rustls 0.21. OWNER: Lantern maintainer (Jameson Daines). REVISIT: 2026-10-19 — re-check whether lancedb has moved its aws-sdk past rustls 0.21." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7 reached only via lancedb's AWS S3/DynamoDB TLS path, which Lantern (local-only vector store) never executes; the actively-used 0.103.x copy is patched to >=0.103.13. OWNER: Lantern maintainer (Jameson Daines). REVISIT: 2026-10-19 — re-check whether lancedb has moved its aws-sdk past rustls 0.21." },

    # --- quick-xml 0.38.4 / 0.39.4: fixed to >=0.41.0 on the load-bearing path ---
    # The path that actually parses UNTRUSTED input — client .docx/.xlsx/.pptx via
    # lantern-docx and commands/rag/office.rs — is bumped to quick-xml 0.41.0
    # (Cargo.toml, both this crate and lantern-docx) and its two breaking API
    # changes (`Attribute::unescape_value` -> `normalized_value`, `BytesText::
    # xml_content` gaining an `XmlVersion` arg) are adapted. Two OTHER, unrelated
    # quick-xml copies remain below 0.41 because their owning crates haven't
    # released a fix yet; both are reviewed as unreachable from untrusted input:
    #   - quick-xml 0.38.4 <- opendal/object_store <- lance-io <- lancedb. This
    #     copy is only used to parse XML LIST responses from S3/GCS/Azure cloud
    #     object-store APIs (object_store's optional "quick-xml" feature, gated
    #     behind its cloud backends). Lantern's lancedb connection always opens
    #     a plain local filesystem path (`rag::store::open_connection` ->
    #     `dataset_path` = workspace_root/.lantern/vectors, never an s3://,
    #     gs://, or az:// URI) — same reasoning as RUSTSEC-2026-0098/99/104 above.
    #   - quick-xml 0.39.4 <- plist 1.9.0 (latest release; no newer plist exists)
    #     <- tauri-utils. Used only to build/merge the macOS/iOS Info.plist
    #     bundle metadata (`tauri_utils::config::file_associations_plist`) from
    #     Lantern's OWN build-time tauri.conf.json / Info.plist inputs — never
    #     from attacker-controlled or network-delivered XML.
    # Both advisories are quadratic-time / unbounded-allocation DoS bugs that
    # require a crafted, attacker-supplied XML document to trigger; neither
    # reachable path accepts one. Tracked for removal when plist and/or
    # object_store/opendal ship a release requiring quick-xml >=0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 (opendal/object_store cloud-list-XML path, unreachable: lancedb is always opened on a local fs path) and 0.39.4 (plist's build-time Info.plist merge, non-attacker-controlled input) are the only remaining unfixed copies; the untrusted-docx-parsing path is bumped to quick-xml 0.41.0. OWNER: Lantern maintainer (Jameson Daines). REVISIT: 2026-10-19 — re-check whether plist and object_store/opendal have released against quick-xml >=0.41." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 (opendal/object_store cloud-list-XML path, unreachable: lancedb is always opened on a local fs path) and 0.39.4 (plist's build-time Info.plist merge, non-attacker-controlled input) are the only remaining unfixed copies; the untrusted-docx-parsing path is bumped to quick-xml 0.41.0. OWNER: Lantern maintainer (Jameson Daines). REVISIT: 2026-10-19 — re-check whether plist and object_store/opendal have released against quick-xml >=0.41." },

    # --- lru 0.12.5: IterMut Stacked-Borrows unsoundness; NOT-REACHABLE ---
    # Verdict: NOT-REACHABLE. Mechanism, derived from the resolved graph and the
    # checksum-verified crate sources rather than from the advisory summary:
    #
    #  1. THE DEFECT IS CONFINED TO ONE TYPE. lru 0.12.5 is a single file
    #     (src/lib.rs). `IterMut` is constructed at exactly two places:
    #     `LruCache::iter_mut()` (lib.rs:1434) and `impl IntoIterator for
    #     &mut LruCache` (lib.rs:1511-1518, which just calls iter_mut).
    #     The unsound `&mut K` is created only in `IterMut::next` (lib.rs:1636)
    #     and `IterMut::next_back` (lib.rs:1660). The upstream fix
    #     (jeromefroe/lru-rs#224) changes only those two methods. `new`, `get`,
    #     `put`, `len`, `peek_lru` are untouched and unaffected.
    #     THE TRIGGER IS A CALL, NOT A VALUE: no input, attacker-controlled or
    #     otherwise, can reach this defect unless `iter_mut` is actually called.
    #
    #  2. ONLY TWO CRATES CAN CALL IT. `cargo tree -i lru --target all
    #     --all-features -e normal,build,dev` resolves lru's reverse deps to
    #     exactly `lantern` and `tantivy 0.24.2` (cargo-deny's own inclusion
    #     graph for this advisory prints the same two). Nothing else in the
    #     ~986-crate tree can name the crate.
    #
    #  3. NEITHER CALLS IT, AND NOBODY ELSE CAN.
    #     - lantern: `lru` appears at src/commands/rag/embedder.rs:66,69,71
    #       only (private `static QUERY_CACHE` + private `fn query_cache()`),
    #       and the only methods invoked are `LruCache::new` (:71), `get` (:164)
    #       and `put` (:185). No iter_mut, no `&mut` iteration.
    #     - tantivy 0.24.2: `lru` appears in one file, src/store/reader.rs
    #       (the only other hit crate-wide is a doc comment in
    #       src/index/segment_reader.rs:136). It is a PRIVATE field
    #       `cache: Option<Mutex<LruCache<usize, Block>>>` of the PRIVATE struct
    #       `BlockCache`, itself a private field of `StoreReader`. Every method
    #       on BlockCache is enumerated at reader.rs:79-119 and calls only
    #       `new`, `get`, `put`, `len`, and `peek_lru` (the last is
    #       `#[cfg(test)]`, so not in the shipped binary). Because the field is
    #       private, no downstream crate can obtain a `&mut LruCache` from
    #       tantivy at all — the unreachability is enforced by Rust visibility,
    #       not by our reading of call sites.
    #     The two `iter_mut` call sites inside lru itself (lib.rs:2287/2327/2366)
    #     are inside `#[cfg(test)] mod tests` (starts lib.rs:1724) and are never
    #     compiled into a dependent build.
    #
    #  BOUND (what this does NOT prove): this is a source-level enumeration of
    #  tantivy 0.24.2 and of this workspace, made sound by the fact that Rust
    #  requires any use of the crate to name `lru` in a path or `use`
    #  (dependency declared with no rename: `[dependencies.lru] version =
    #  "0.12.0"`), and both crate sources were verified byte-identical to the
    #  .crate archives whose sha256 match the Cargo.lock checksums. It would be
    #  defeated only by a proc macro *outside* tantivy emitting an `lru::` path
    #  into tantivy's code, which was not separately enumerated. It also does not
    #  prove absence of UB elsewhere in lru — only that RUSTSEC-2026-0002's
    #  specific defect (IterMut) has no caller.
    #
    #  NO FIX EXISTS AS A BUMP: patched range is >=0.16.3, but tantivy 0.24.2
    #  requires `lru ^0.12.0`. Raising our own `lru = "0.12"` would ADD a second
    #  copy and leave 0.12.5 in the lock, so the gate would still fail. The real
    #  fix is a tantivy release built against lru >=0.16.3.
    #
    #  OWNER: Lantern maintainer (Jameson Daines).
    #  REVISIT: 2026-10-19. cargo-deny 0.19's ignore entry accepts only the keys
    #  ["id", "reason"] — it has NO `expires` field (verified: adding one fails
    #  with `error[unexpected-keys] ... expected: ["id", "reason"]`), so the date
    #  cannot be tool-enforced by cargo-deny. It is enforced instead by
    #  scripts/check-deny-revisit.sh, which fails once the date passes.
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 IterMut Stacked-Borrows unsoundness. NOT-REACHABLE: the defect lives only in IterMut::next/next_back (upstream fix lru-rs#224 touches only those two methods), and IterMut can only be created by LruCache::iter_mut / IntoIterator-for-&mut. The resolved graph has exactly two dependents of lru — lantern and tantivy 0.24.2 — and neither ever creates one: lantern uses only new/get/put on a private static QUERY_CACHE (src/commands/rag/embedder.rs:66,164,185); tantivy uses only new/get/put/len (+ cfg(test) peek_lru) on a PRIVATE field of a private struct (src/store/reader.rs:73-119), so no other crate can even obtain a &mut LruCache. The trigger is a CALL, not a value, so no attacker-controlled input reaches it. No SemVer fix exists: tantivy 0.24.2 pins lru ^0.12.0, so bumping our own dep to >=0.16.3 would add a second copy and leave 0.12.5 in the lock. OWNER: Lantern maintainer (Jameson Daines). REVISIT: 2026-10-19 — re-check whether tantivy has released against lru >=0.16.3; enforced by scripts/check-deny-revisit.sh because cargo-deny 0.19 has no expires field." },
]

# ---------------------------------------------------------------------------
# Licenses  (cargo deny check licenses)
# ---------------------------------------------------------------------------
# cargo-deny is an ALLOW-LIST: any license NOT in `allow` below fails the
# build. That is the whole point of the gate — strong copyleft (GPL-2.0/3.0,
# AGPL, SSPL, LGPL-as-the-only-license, etc.) is intentionally ABSENT and will
# therefore fail CI, forcing a human to evaluate any such new dependency before
# it can ship inside this closed-source app.
#
# Every entry below is a permissive (or public-domain-equivalent) license that
# is ACTUALLY present in Lantern's resolved tree today and is safe to ship in
# a proprietary binary. Two notes on weak copyleft and dual licensing:
#
#   * MPL-2.0 is allowed. It is FILE-LEVEL (weak) copyleft: using or linking
#     the unmodified crates (cssparser, selectors, option-ext, dtoa-short,
#     cssparser-macros) imposes NO obligation to open-source Lantern. Only
#     direct modifications to those specific MPL files would need sharing.
#
#   * Crates dual-licensed as "<permissive> OR <copyleft>" (e.g. self_cell is
#     "Apache-2.0 OR GPL-2.0-only"; r-efi is "MIT OR Apache-2.0 OR
#     LGPL-2.1-or-later") are automatically satisfied via their permissive arm,
#     so they need no exception and pull in no copyleft obligation.
[licenses]
allow = [
    # Permissive — the overwhelming majority of the tree.
    "MIT",
    "MIT-0",                       # MIT No Attribution
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",                        # zero-clause BSD (public-domain-equivalent)
    "Zlib",
    "zlib-acknowledgement",        # fastdivide
    "bzip2-1.0.6",                 # libbz2-rs-sys
    "BSL-1.0",                     # Boost Software License (ryu, xxhash-rust)
    "NCSA",                        # University of Illinois/NCSA (libfuzzer-sys)
    "Unicode-3.0",                 # unicode-ident et al.
    "CDLA-Permissive-2.0",         # webpki-roots (Mozilla CA bundle data)
    # Public-domain dedications — safe to ship.
    "Unlicense",
    "CC0-1.0",
    # Weak / file-level copyleft — safe for a proprietary binary (see note above).
    "MPL-2.0",
]
confidence-threshold = 0.8
# Per-crate license exceptions. Empty by design — prefer upgrading/replacing a
# dep over carving out an exception. Add one only with a clear, reviewed reason.
exceptions = [
    #{ allow = ["..."], crate = "some-crate", reason = "why" },
]
# Don't warn when an allowed license isn't currently matched by any crate. Keeps
# the gate quiet if a permissive dep is feature-gated off on some target while
# still vetting it when it IS pulled in.
unused-allowed-license = "allow"

[licenses.private]
# Lantern's own workspace crates are unpublished; never license-check them.
ignore = true

# ---------------------------------------------------------------------------
# Bans  (cargo deny check bans)
# ---------------------------------------------------------------------------
# No crate is hard-banned today. Duplicate versions are reported as warnings
# (the tree legitimately carries several, e.g. base64 0.13/0.21/0.22) rather
# than failing CI, so this check passes while still surfacing bloat.
[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true
deny = [
    #{ crate = "some-crate", reason = "why it is banned" },
]

# ---------------------------------------------------------------------------
# Sources  (cargo deny check sources)
# ---------------------------------------------------------------------------
# Every external dependency must come from crates.io. Lantern uses no git or
# alternate-registry dependencies (verified: 986/986 external crates are
# crates.io). A new git/unknown-registry source will fail CI — a supply-chain
# guard against an unvetted dependency slipping in.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
