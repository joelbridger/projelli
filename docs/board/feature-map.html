<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="feature-map-renderer-version" content="four-label-v1">
<title>Lantern Feature Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f6; --dot:#e9e5dc;
    --card:#ffffff; --line:#e7e2d8; --line-soft:#efebe2;
    --ink:#292520; --ink-soft:#6f6a60; --ink-mute:#98917f;
    --gold:#c07c18; --gold-soft:#f7ead2;
    --planned:#43536a; --planned-bg:#eceff4;
    --being-built:#854d00; --being-built-bg:#faf0dc;
    --built-checking:#70347d; --built-checking-bg:#f5e9f7;
    --proven-windows:#146947; --proven-windows-bg:#e5f3ec;
    --flow:#ded7c7;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Albert Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{font-family:var(--sans); background:var(--paper); color:var(--ink)}

  /* ── the board ─────────────────────────────────────────── */
  #viewport{position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none}
  #viewport.panning{cursor:grabbing}
  #world{position:absolute; top:0; left:0; transform-origin:0 0;
    background-image:radial-gradient(circle, var(--dot) 1.4px, transparent 1.5px);
    background-size:42px 42px}
  #arrows{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}

  /* ── floating chrome ───────────────────────────────────── */
  .hud{position:fixed; z-index:20; font-size:13px}
  .hud-top{top:18px; left:20px; right:20px; display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; pointer-events:none}
  .hud-top>*{pointer-events:auto}
  .titlecard{background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:16px; padding:14px 18px 13px; box-shadow:0 4px 18px rgba(41,37,32,.05); max-width:430px}
  .titlecard h1{font-family:var(--serif); font-weight:640; font-size:21px; letter-spacing:.1px; display:flex; align-items:center; gap:9px}
  .titlecard p{margin-top:4px; color:var(--ink-soft); font-size:12.8px; line-height:1.45}
  .titlecard .counts{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap}
  .count{border-radius:999px; padding:3px 10px; font-weight:600; font-size:11.5px; border:1px solid}
  .count.c-planned{color:var(--planned); background:var(--planned-bg); border-color:#dbe1ea}
  .count.c-being-built{color:var(--being-built); background:var(--being-built-bg); border-color:#eeddb9}
  .count.c-built-checking{color:var(--built-checking); background:var(--built-checking-bg); border-color:#e6cdeb}
  .count.c-proven-windows{color:var(--proven-windows); background:var(--proven-windows-bg); border-color:#cfe7db}
  .filters{display:flex; gap:7px; flex-wrap:wrap; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; padding:6px; box-shadow:0 4px 18px rgba(41,37,32,.05); height:fit-content}
  .chip{font:inherit; font-size:12.5px; font-weight:600; border:none; background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
  .chip:hover{background:#f3f0e9}
  .chip.active{background:var(--ink); color:#fff}
  .chip .dot{width:8px; height:8px; border-radius:50%}
  .hud-hint{position:fixed; top:18px; right:20px; z-index:20; color:var(--ink-mute); font-size:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(8px); border:1px solid var(--line-soft); border-radius:999px; padding:6px 13px}
  .hud-zoom{bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; padding:5px; box-shadow:0 6px 22px rgba(41,37,32,.08)}
  .hud-zoom button{font:inherit; font-size:15px; font-weight:600; width:34px; height:34px; border:none; background:transparent; color:var(--ink); border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center}
  .hud-zoom button:hover{background:#f3f0e9}
  .hud-zoom .pct{min-width:52px; text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .hud-zoom .fit{width:auto; padding:0 14px; font-size:12.5px}
  .hud-zoom .sep{width:1px; height:20px; background:var(--line); margin:0 3px}
  .updated{position:fixed; bottom:22px; right:20px; z-index:20; color:var(--ink-mute); font-size:11.5px}
  .nonv1{position:fixed; right:20px; bottom:48px; z-index:20; max-width:300px; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:12px; padding:9px 12px; color:var(--ink-soft); font-size:11.5px; line-height:1.4; box-shadow:0 4px 18px rgba(41,37,32,.05)}
  .nonv1 strong{display:block; color:var(--ink); font-size:12px}.nonv1 details{margin-top:5px}.nonv1 summary{cursor:pointer;color:var(--ink)}.nonv1 ul{margin:6px 0 0 16px}.nonv1 li+li{margin-top:4px}

  /* ── stage cards ───────────────────────────────────────── */
  .stagecard{position:absolute; width:330px; background:var(--card); border:1px solid var(--line-soft); border-radius:14px; box-shadow:0 4px 18px rgba(41,37,32,.04)}
  .stagecard header{padding:18px 18px 14px; border-bottom:1px solid var(--line-soft)}
  .kicker{font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold)}
  .stagecard h2{font-family:var(--serif); font-weight:640; font-size:19px; margin-top:5px; display:flex; gap:9px; align-items:baseline}
  .stagecard h2 .picto{font-size:16px}
  .stagecard .story{margin-top:6px; font-size:12.6px; color:var(--ink-soft); line-height:1.5}
  ul.features{list-style:none; padding:12px 16px 18px}
  li.group{border-top:1px solid var(--line-soft); padding-top:14px; margin-top:16px}
  li.group:first-child{border-top:none; padding-top:0; margin-top:2px}
  li.group .glabel{font-size:13.5px; font-weight:700; color:var(--ink)}
  li.feat{display:flex; gap:10px; align-items:flex-start; padding:8px 2px 8px 0; border-radius:10px; transition:opacity .25s}
  .stop{flex:none; width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; border:1.5px solid; background:#fff; margin-top:2px}
  .s-planned .stop{color:var(--planned); border-color:var(--planned); background:var(--planned-bg)}
  .s-being-built .stop{color:var(--being-built); border-color:var(--being-built); background:var(--being-built-bg)}
  .s-built-checking .stop{color:var(--built-checking); border-color:var(--built-checking); background:var(--built-checking-bg)}
  .s-proven-windows .stop{color:var(--proven-windows); border-color:var(--proven-windows); background:var(--proven-windows-bg)}
  .feat .name{font-size:13.2px; font-weight:600; line-height:1.4}
  .s-planned .name{color:#4d5a70}
  .feat .note{font-size:11.8px; color:var(--ink-mute); margin-top:2px; line-height:1.45}
  .feat .badge{display:none; font-size:9.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; border-radius:5px; padding:1px 6px; margin-left:7px; vertical-align:1px}
  .s-being-built .badge{display:inline-block; color:var(--being-built); background:transparent; border:1px solid #e5cfa2}
  .s-built-checking .badge{display:inline-block; color:var(--built-checking); background:transparent; border:1px solid #e6cdeb}
  .s-planned .badge{display:inline-block; color:var(--planned); background:transparent; border:1px solid #ccd4e0}
  .s-proven-windows .badge{display:inline-block; color:var(--proven-windows); background:transparent; border:1px solid #99bba9}
  li.feat.hero{border-left:3px solid var(--gold); border-radius:2px; padding:8px 4px 8px 10px; margin:2px 0}
  li.feat.hero .name{font-size:14.2px; font-weight:750}
  li.feat.hero .star{color:var(--gold); font-size:12px; margin-left:6px}
  li.feat.sub{padding-left:8px}
  li.feat.sub .stop{width:17px; height:17px; font-size:9px}
  li.feat.sub .name{font-weight:500; font-size:12.7px}

  /* arrow labels */
  .alabel{position:absolute; transform:translate(-50%,-50%); background:#fffdf9; border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:4px 12px; font-size:11.3px; white-space:nowrap; box-shadow:none}
  .alabel.fly{color:var(--gold); border-color:#ecd9b4; background:#fffaf0; max-width:520px; white-space:normal; text-align:center; line-height:1.4}

  /* ── foundation band ───────────────────────────────────── */
  .foundation{position:absolute; background:#fdfcf9; border:1px solid var(--line-soft); border-radius:14px; color:var(--ink); padding:22px 26px; box-shadow:0 4px 18px rgba(41,37,32,.04)}
  .foundation h2{font-family:var(--serif); font-weight:640; font-size:18px; display:flex; gap:9px; align-items:center}
  .foundation .story{font-size:12.6px; color:var(--ink-soft); margin-top:5px}
  .foundation ul{list-style:none; display:flex; flex-wrap:wrap; gap:10px; margin-top:15px}
  .foundation li{display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line-soft); border-radius:999px; padding:6px 14px 6px 8px; font-size:12.4px; font-weight:600; transition:opacity .25s}
  .foundation li .stop{width:18px; height:18px; font-size:9px; border-width:2px}
  .foundation li .note{font-weight:400; color:var(--ink-mute); font-size:11.3px}
  .foundation-status{display:none}

  body.f-planned li.feat:not(.s-planned), body.f-being-built li.feat:not(.s-being-built), body.f-built-checking li.feat:not(.s-built-checking), body.f-proven-windows li.feat:not(.s-proven-windows),
  body.f-planned .foundation li:not(.s-planned), body.f-being-built .foundation li:not(.s-being-built), body.f-built-checking .foundation li:not(.s-built-checking), body.f-proven-windows .foundation li:not(.s-proven-windows){opacity:.14}

  /* ── THEME: Editorial — an annual-report spread ───────── */
  body.style-editorial{
    --paper:#f6f0e3; --dot:#ded4c2; --card:#f6f0e3; --line:#cfc3ad; --line-soft:#e1d7c8;
    --ink:#1c2430; --ink-soft:#5d665f; --ink-mute:#838174; --gold:#b65332; --gold-soft:#f2dfd1;
    --flow:#7f8b85; --serif:"Newsreader",Georgia,serif; --sans:"Albert Sans",ui-sans-serif,sans-serif;
  }
  body.style-editorial #world{background-image:linear-gradient(90deg,rgba(64,74,76,.045) 1px,transparent 1px),linear-gradient(rgba(64,74,76,.045) 1px,transparent 1px);background-size:96px 96px}
  body.style-editorial .titlecard{background:transparent;border:0;border-top:3px solid var(--ink);border-radius:0;box-shadow:none;padding:12px 0 0;max-width:470px}
  body.style-editorial .titlecard h1{font-family:var(--serif);font-size:31px;letter-spacing:-.7px;line-height:.95}
  body.style-editorial .titlecard p{font-size:13px;max-width:410px}
  body.style-editorial .filters{background:rgba(246,240,227,.93);border:1px solid var(--ink);border-radius:0;box-shadow:none;padding:4px}
  body.style-editorial .chip{border-radius:0;font-size:11px;letter-spacing:.35px;text-transform:uppercase;padding:8px 10px}
  body.style-editorial .chip:hover{background:#e8ddca}
  body.style-editorial .chip.active{background:var(--ink);color:#fff}
  body.style-editorial .hud-hint,.style-editorial .hud-zoom{box-shadow:none;border-radius:0;background:rgba(246,240,227,.94);border-color:var(--ink)}
  body.style-editorial .hud-zoom button{border-radius:0}
  body.style-editorial .hud-zoom button:hover{background:#e8ddca}
  body.style-editorial .updated{font-family:var(--sans);letter-spacing:.5px;text-transform:uppercase}
  body.style-editorial .stagecard{width:440px;background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;box-shadow:none}
  body.style-editorial .stagecard header{padding:18px 0 20px;border-bottom:1px solid var(--line)}
  body.style-editorial .kicker{color:var(--gold);font-size:11px;letter-spacing:2.2px}
  body.style-editorial .stagecard h2{font-family:var(--serif);font-size:37px;font-weight:500;line-height:.98;letter-spacing:-1px;margin-top:10px;gap:12px}
  body.style-editorial .stagecard h2 .picto{font-family:var(--sans);font-size:22px;line-height:1.2}
  body.style-editorial .stagecard .story{font-family:var(--serif);font-size:16px;line-height:1.35;max-width:385px;margin-top:12px;color:var(--ink-soft)}
  body.style-editorial ul.features{padding:18px 0 8px;columns:1}
  body.style-editorial li.group{border-top:1px solid var(--line);padding-top:16px;margin-top:19px}
  body.style-editorial li.group .glabel{font-size:10px;letter-spacing:1.8px;text-transform:uppercase}
  body.style-editorial li.feat{gap:9px;padding:8px 0;border-radius:0}
  body.style-editorial .stop{width:16px;height:16px;border-radius:0;margin-top:3px;font-size:8px}
  body.style-editorial .feat .name{font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.2}
  body.style-editorial .feat .note{font-size:11px;line-height:1.38;max-width:365px}
  body.style-editorial li.feat.hero{border-left:0;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:10px 0;margin:6px 0}
  body.style-editorial li.feat.hero .name{font-size:19px;font-weight:700}
  body.style-editorial li.feat.sub{padding-left:20px}
  body.style-editorial .feat .badge{display:inline-block!important;border-radius:0;margin-left:7px;padding:2px 5px;font-family:var(--sans);font-size:8.5px;letter-spacing:.7px;vertical-align:2px}
  body.style-editorial .s-proven-windows .badge{color:var(--proven-windows);border:1px solid #99bba9;background:transparent}
  body.style-editorial .alabel{border-radius:0;background:var(--paper);box-shadow:none;font-family:var(--serif);font-size:13px;border-color:var(--line)}
  body.style-editorial .alabel.fly{background:var(--paper);border-color:var(--gold);color:var(--gold)}
  body.style-editorial .foundation{background:transparent;border:0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);border-radius:0;box-shadow:none;padding:22px 0 24px}
  body.style-editorial .foundation h2{font-family:var(--serif);font-size:27px;font-weight:500}
  body.style-editorial .foundation .story{font-family:var(--serif);font-size:15px;max-width:620px}
  body.style-editorial .foundation ul{gap:0;margin-top:18px}
  body.style-editorial .foundation li{background:transparent;border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 16px 6px 0;margin-right:16px;font-size:12px}
  body.style-editorial .foundation-status{display:inline;font-size:8px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}

  /* ── THEME: Metro — a literal practice transit map ─────── */
  body.style-metro{
    --paper:#f5fbff; --dot:#dfeef5; --card:transparent; --line:#c6dae6; --line-soft:#dcebf2;
    --ink:#172b3a; --ink-soft:#506b7b; --ink-mute:#7892a1; --gold:#f0523e; --gold-soft:#ffe3dc;
    --planned:#466e9c; --planned-bg:#e2edf8; --being-built:#b65b05; --being-built-bg:#ffedcf; --built-checking:#954e9d; --built-checking-bg:#f7e8f8; --proven-windows:#087d63; --proven-windows-bg:#d9f4eb;
    --flow:#f0523e; --serif:"Space Grotesk",ui-sans-serif,sans-serif; --sans:"Space Grotesk",ui-sans-serif,sans-serif;
  }
  body.style-metro #world{background-image:linear-gradient(rgba(39,119,170,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(39,119,170,.055) 1px,transparent 1px);background-size:32px 32px}
  body.style-metro .titlecard{border:2px solid var(--ink);border-radius:8px;background:#fff;box-shadow:none;padding:13px 16px;max-width:410px}
  body.style-metro .titlecard h1{font-family:var(--sans);font-size:20px;font-weight:700;letter-spacing:-.7px}
  body.style-metro .titlecard p{font-size:12px;line-height:1.4}
  body.style-metro .filters{background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:none;padding:4px}
  body.style-metro .chip{font-size:11px;border-radius:5px;padding:7px 10px}
  body.style-metro .chip:hover{background:#eaf4f9}
  body.style-metro .hud-hint,.style-metro .hud-zoom{background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:none}
  body.style-metro .hud-zoom button{border-radius:5px}
  body.style-metro .hud-zoom button:hover{background:#eaf4f9}
  body.style-metro .stagecard{width:270px;background:transparent;border:0;border-radius:0;box-shadow:none}
  body.style-metro .stagecard header{position:relative;min-height:70px;padding:0 0 12px 68px;border:0}
  body.style-metro .kicker{font-size:9px;letter-spacing:1.4px;color:#2378a9;padding-top:2px}
  body.style-metro .stagecard h2{font-family:var(--sans);font-size:18px;font-weight:700;line-height:1.04;letter-spacing:-.7px;margin:4px 0 0;display:block}
  body.style-metro .stagecard h2 .picto{position:absolute;left:0;top:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:7px solid #f0523e;border-radius:50%;background:#fff;font-size:21px;z-index:2}
  body.style-metro .stagecard .story{font-size:10.8px;line-height:1.35;margin-top:5px;color:var(--ink-soft)}
  body.style-metro ul.features{margin-left:25px;padding:2px 0 4px 42px;border-left:2px solid #a9cfe0}
  body.style-metro li.group{position:relative;border:0;padding:13px 0 4px;margin:0}
  body.style-metro li.group .glabel{display:inline-block;background:#e6f4fa;border:1px solid #a9cfe0;border-radius:4px;padding:3px 5px;font-size:9px;letter-spacing:.5px;text-transform:uppercase}
  body.style-metro li.feat{position:relative;gap:0;padding:5px 0 6px;border-radius:0}
  body.style-metro .feat .body{display:block}
  body.style-metro .stop{position:absolute;left:-53px;top:5px;width:19px;height:19px;border:3px solid;background:#fff;margin:0;font-size:8px;z-index:2}
  body.style-metro .feat .name{font-family:var(--sans);font-size:11.5px;font-weight:600;line-height:1.22}
  body.style-metro .feat .note{font-size:10px;line-height:1.3;margin-top:2px}
  body.style-metro li.feat.hero{border-left:0;background:#fff2ed;border-radius:5px;padding:8px 8px;margin:3px 0}
  body.style-metro li.feat.hero .stop{left:-61px;top:8px;width:27px;height:27px;border-color:#f0523e;background:#fff;font-size:11px}
  body.style-metro li.feat.hero .name{font-size:12.8px;font-weight:700}
  body.style-metro li.feat.sub{padding-left:0}
  body.style-metro .feat .badge{display:inline-block!important;border-radius:4px;margin:3px 0 0;padding:2px 4px;font-size:8px;letter-spacing:.3px}
  body.style-metro .s-proven-windows .badge{color:var(--proven-windows);background:var(--proven-windows-bg);border:1px solid #a7d8c7}
  body.style-metro .alabel{border:0;border-radius:4px;background:#fff;color:#2378a9;box-shadow:none;font-size:10px;font-weight:700;padding:4px 6px}
  body.style-metro .alabel.fly{background:#fff3c8;border:2px solid #f6c847;color:#73590c}
  body.style-metro .foundation{background:#e8f4f9;border:0;border-top:9px solid var(--ink);border-radius:0;box-shadow:none;padding:17px 24px 22px}
  body.style-metro .foundation h2{font-family:var(--sans);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  body.style-metro .foundation .story{font-size:11.5px;max-width:720px}
  body.style-metro .foundation ul{gap:6px;margin-top:12px}
  body.style-metro .foundation li{border:1px solid #9fc7d9;border-radius:4px;background:#fff;padding:5px 8px;font-size:11px}
  body.style-metro .foundation li .stop{position:static;width:16px;height:16px;border-width:2px;font-size:7px}
  body.style-metro .foundation-status{display:block;font-size:8px;font-weight:700;color:var(--ink-soft);margin-top:2px}

  /* ── THEME: Bento — friendly, high-density product tiles ─ */
  body.style-bento{
    --paper:#fff9f5; --dot:#f1e5dc; --card:#fff; --line:#eadfd8; --line-soft:#f0e7e1;
    --ink:#342b44; --ink-soft:#6d6279; --ink-mute:#95899d; --gold:#7457d9; --gold-soft:#ebe5ff;
    --planned:#5d66a1; --planned-bg:#e8ebff; --being-built:#aa5a16; --being-built-bg:#fff0d9; --built-checking:#914e99; --built-checking-bg:#f5e7f8; --proven-windows:#087b60; --proven-windows-bg:#dff5ec;

  body.style-bento #world{background-image:radial-gradient(circle at 12% 14%,rgba(255,196,171,.42) 0 2px,transparent 2.5px),radial-gradient(circle at 82% 24%,rgba(187,171,255,.35) 0 2px,transparent 2.5px);background-size:38px 38px,52px 52px}

  body.style-bento .titlecard p{font-size:12.3px}
  body.style-bento .filters{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 12px 32px rgba(98,69,115,.1);padding:5px}

  body.style-bento .stagecard:nth-of-type(4){background:#f1eeff}
  body.style-bento .stagecard:nth-of-type(5){background:#eff9ed}

  body.style-bento .stagecard:nth-of-type(8){background:#eaf8f6}
  body.style-bento .stagecard header{padding:20px 21px 14px;border-bottom:0}
  body.style-bento .kicker{font-size:10px;letter-spacing:1.2px;color:#75648e}
  body.style-bento .stagecard h2{font-family:var(--sans);font-size:25px;font-weight:900;line-height:1.02;letter-spacing:-1px;margin-top:6px;align-items:flex-start}
  body.style-bento .stagecard h2 .picto{font-size:34px;line-height:.9;filter:drop-shadow(0 4px 4px rgba(100,77,98,.10))}
  body.style-bento .stagecard .story{font-size:12px;line-height:1.42;margin-top:9px;color:var(--ink-soft)}
  .bento-inflow{display:inline-block; margin:14px 0 0 20px; font-size:11px; font-weight:700; color:#6b5bb3; background:#f1ecff; border-radius:999px; padding:4px 12px; letter-spacing:.2px}
  body.style-bento ul.features{padding:5px 15px 17px}
  body.style-bento li.group{border-top:1px solid rgba(92,74,110,.13);padding-top:13px;margin-top:12px}
  body.style-bento li.group:first-child{border-top:0}
  body.style-bento li.group .glabel{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#685a7d}
  body.style-bento li.feat{gap:8px;padding:7px 9px;background:rgba(255,255,255,.70);border:1px solid rgba(255,255,255,.9);border-radius:14px;margin-top:5px}
  body.style-bento .stop{width:18px;height:18px;margin-top:1px}
  body.style-bento .feat .name{font-family:var(--sans);font-size:12px;font-weight:800;line-height:1.28}
  body.style-bento .feat .note{font-size:10.6px;line-height:1.35}
  body.style-bento li.feat.hero{border-left:0;background:#392c67;color:#fff;border-color:#392c67;border-radius:16px;padding:10px;margin-top:6px}

  body.style-bento li.feat.hero .note{color:#ddd4ff}
  body.style-bento li.feat.hero .star{color:#ffe66c}
  body.style-bento li.feat.hero .stop{background:#fff;border-color:#fff;color:#392c67}
  body.style-bento li.feat.sub{padding-left:9px}
  body.style-bento .feat .badge{display:inline-block!important;border-radius:999px;margin-left:4px;padding:2px 6px;font-size:8px;letter-spacing:.2px;vertical-align:1px}
  body.style-bento .s-proven-windows .badge{color:var(--proven-windows);background:var(--proven-windows-bg);border:1px solid #bae5d5}
  body.style-bento li.feat.hero .badge{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
  body.style-bento .alabel{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:999px;box-shadow:0 8px 18px rgba(100,77,98,.1);color:#65547e;font-weight:700}
  body.style-bento .alabel.fly{background:#ede7ff;border-color:#d5c8ff;color:#6047bd}
  body.style-bento .foundation{background:#e9e3ff;border:1px solid #fff;border-radius:28px;box-shadow:0 16px 36px rgba(100,77,98,.10);padding:22px 24px}
  body.style-bento .foundation h2{font-family:var(--sans);font-size:22px;font-weight:900;letter-spacing:-.7px}
  body.style-bento .foundation .story{font-size:12px;color:#625576}
  body.style-bento .foundation ul{gap:7px;margin-top:14px}
  body.style-bento .foundation li{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);border-radius:999px;padding:6px 11px 6px 7px;font-size:11px}
  body.style-bento .foundation li .stop{width:17px;height:17px;font-size:8px}
  body.style-bento .foundation-status{display:inline;font-size:8px;font-weight:800;color:#6b5d82;margin-left:2px}

  body.commenting #viewport{cursor:crosshair}
  .hud-zoom .cmode.active{background:var(--gold); color:#fff}
  .cnote,.composer{position:absolute; z-index:5; width:230px; background:#fff8dd; border:1px solid #ecd98f; border-radius:4px 14px 14px 14px; box-shadow:0 10px 26px rgba(41,37,32,.16); padding:10px 12px 11px; font-size:12.6px}
  .cnote::before,.composer::before{content:"💬"; position:absolute; top:-13px; left:-13px; width:26px; height:26px; background:var(--gold); border-radius:50% 50% 50% 4px; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 4px 10px rgba(41,37,32,.25)}
  .cnote .nhead{display:flex; align-items:baseline; gap:7px; margin-bottom:4px}
  .cnote .nhead b{font-size:12.2px}
  .cnote .ntime{color:#a08d4e; font-size:10.8px; flex:1}
  .cnote .ndel{border:none; background:none; color:#b3a05e; cursor:pointer; font-size:14px; line-height:1; padding:2px}
  .cnote .ndel:hover{color:#8a2222}
  .cnote .ntext{line-height:1.5; white-space:pre-wrap; word-wrap:break-word}
  .composer textarea{width:100%; min-height:76px; border:1px solid #e2cd7f; border-radius:8px; background:#fffdf2; font:inherit; padding:8px; resize:vertical; outline:none}

  .composer .crow{display:flex; gap:6px; align-items:center; margin-top:7px}
  .composer .cname{flex:1; min-width:0; border:1px solid #e2cd7f; border-radius:8px; background:#fffdf2; font:inherit; font-size:11.8px; padding:5px 8px; outline:none}
  .composer button{font:inherit; font-size:12px; font-weight:600; border:none; border-radius:8px; padding:6px 10px; cursor:pointer}
  .composer .mic{background:#f3e8c0}
  .composer .mic.rec{background:#e05a4e; color:#fff; animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .composer .ccancel{background:transparent; color:var(--ink-soft)}
  .composer .csave{background:var(--ink); color:#fff; padding:6px 14px}
  .hint-comment{position:fixed; top:64px; right:20px; z-index:20; background:var(--gold); color:#fff; border-radius:999px; padding:7px 15px; font-size:12.5px; box-shadow:0 8px 22px rgba(192,124,24,.35); display:none}

<body>

<div id="viewport"><div id="world"><div id="mapcontent"></div></div></div>

<div class="hud hud-top">
  <div class="titlecard">
    <h1><span>🗺️</span> Lantern Feature Map</h1>
    <p>The whole product as one journey, left to right — every feature at its place in an advisor's day. Privacy is the floor it all stands on.</p>
    <div class="counts" id="counts"></div>
  </div>
  <div class="filters layers" id="layers" role="group" aria-label="Layers"></div>
  <div class="filters styles" id="styles" role="group" aria-label="Style"><span class="picker-label">Style</span></div>
  <div class="filters" id="statusfilters" role="group" aria-label="Filter by status">
    <button class="chip active" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="planned" aria-pressed="false"><span class="dot" style="background:var(--planned)"></span>○ Planned</button>
    <button class="chip" data-f="being-built" aria-pressed="false"><span class="dot" style="background:var(--being-built)"></span>◐ Being built</button>
    <button class="chip" data-f="built-checking" aria-pressed="false"><span class="dot" style="background:var(--built-checking)"></span>◒ Built — checking it</button>
    <button class="chip" data-f="proven-windows" aria-pressed="false"><span class="dot" style="background:var(--proven-windows)"></span>✓ Proven on Windows</button>
  </div>
</div>
<div class="hud-hint">✋ drag to move around · scroll to zoom · double-click to zoom in</div>
<div class="hud hud-zoom">
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <span class="pct" id="zpct">100%</span>
  <button id="zin" title="Zoom in" aria-label="Zoom in">＋</button>
  <span class="sep"></span>
  <button class="fit" id="zfit" title="Fit the whole map on screen">Fit map</button>
  <span class="sep"></span>
  <button class="fit cmode" id="cmode" title="Click anywhere on the map to leave a note">💬 Comment</button>
</div>
<div class="hint-comment">Now click anywhere on the map to pin your comment</div>

  {id:'editorial', name:'Editorial', title:'A calm annual-report spread'},
  {id:'metro',     name:'Metro',     title:'A literal transit-map journey'},
  {id:'bento',     name:'Bento',     title:'A friendly product-tile grid'}
];
function hasChoice(list,id){ return list.some(function(item){ return item.id===id; }); }
var hashParams=new URLSearchParams((location.hash||'').replace(/^#/,''));
var state={
  layer:hasChoice(LAYERS,hashParams.get('layer')) ? hashParams.get('layer') : 'today',
  filter:'all',
  style:hasChoice(STYLES,hashParams.get('style')) ? hashParams.get('style') : 'classic'
};
function applyBodyState(){
  var cls=['style-'+state.style];
  if(state.filter!=='all') cls.push('f-'+state.filter);
  if(state.layer!=='today') cls.push('layer-'+state.layer);
  document.body.className=cls.join(' ');
}
function writeHash(){
  try{history.replaceState(null,'','#layer='+encodeURIComponent(state.layer)+'&style='+encodeURIComponent(state.style));}catch(e){}
}

var world=document.getElementById('world');
var mapc=document.getElementById('mapcontent');
var svg=document.getElementById('arrows');
var STAGE_W=330, GAP_X=170, MARGIN=140;
var STAGGER=[0,64,18,80,10,70,32];
var MAPDATA=null, worldW=0, worldH=0, pz=null, fitMap=null;

function layerDef(){ for(var i=0;i<LAYERS.length;i++){ if(LAYERS[i].id===state.layer) return LAYERS[i]; } return LAYERS[0]; }

function themeLayout(style,count){
  var layout={positions:[], worldW:0, foundationX:MARGIN, foundationW:0, foundationGap:90};
  var i, col, row;
  if(style==='editorial'){
    for(i=0;i<count;i++){
      layout.positions.push({x:120+i*400,y:150+[0,36,12,48,20,42,16][i%7],w:360});
    }
    layout.worldW=2960; layout.foundationX=120; layout.foundationW=2720; layout.foundationGap=110;
  }else if(style==='metro'){
    var metroY=[285,220,315,235,310,225,300];
    for(i=0;i<count;i++) layout.positions.push({x:100+i*390,y:metroY[i%metroY.length],w:270});
    layout.worldW=2810; layout.foundationX=100; layout.foundationW=2610; layout.foundationGap=105;
  }else if(style==='bento'){
    var tiles=[], bentoW=[320,420,330,320,330,460,320], bentoY=[150,230,170,215,160,240,185], bx=120;
    for(i=0;i<count;i++){ tiles.push({x:bx,y:bentoY[i%7],w:bentoW[i%7]}); bx+=bentoW[i%7]+140; }
    for(i=0;i<count;i++) layout.positions.push(tiles[i]||{x:100+i*390,y:1900,w:360});
    layout.worldW=3560; layout.foundationX=120; layout.foundationW=3320; layout.foundationGap=130;
  }else{
    for(i=0;i<count;i++) layout.positions.push({x:MARGIN+i*(STAGE_W+GAP_X),y:MARGIN+STAGGER[i%STAGGER.length],w:STAGE_W});
    layout.worldW=MARGIN*2+count*STAGE_W+(count-1)*GAP_X;
    layout.foundationW=layout.worldW-MARGIN*2;
  }
  return layout;
}

function addLabel(text,x,y,extraClass){
  if(!text)return;
  var lb=document.createElement('div'); lb.className='alabel'+(extraClass?' '+extraClass:''); lb.textContent=text;
  lb.style.left=x+'px'; lb.style.top=y+'px'; mapc.appendChild(lb);
}

function addFlywheel(cards,d){
  var last=cards[cards.length-1], mid=cards[2];
  if(!last||!mid)return;
  var fx1=last.x+last.w/2, fy1=last.y-8, fx2=mid.x+mid.w/2, fy2=mid.y-8;
  var top=Math.max(54,Math.min(fy1,fy2)-84);
  var p2=document.createElementNS('http://www.w3.org/2000/svg','path');
  p2.setAttribute('d','M'+fx1+','+fy1+' C'+fx1+','+top+' '+fx2+','+top+' '+fx2+','+fy2);
  p2.setAttribute('fill','none');
  if(state.style==='bento'){
    p2.setAttribute('class','bento-ribbon'); p2.setAttribute('stroke','#c6b5ff'); p2.setAttribute('stroke-width','18'); p2.setAttribute('stroke-linecap','round');
    var inner=document.createElementNS('http://www.w3.org/2000/svg','path');
    inner.setAttribute('d',p2.getAttribute('d')); inner.setAttribute('fill','none'); inner.setAttribute('stroke','#7659de'); inner.setAttribute('stroke-width','2.5'); inner.setAttribute('stroke-linecap','round'); svg.appendChild(p2); svg.appendChild(inner);
  }else{
    p2.setAttribute('stroke',state.style==='editorial'?'#b65332':'#dfc79a'); p2.setAttribute('stroke-width','2.25'); p2.setAttribute('stroke-dasharray','7 7'); p2.setAttribute('marker-end','url(#ah)'); svg.appendChild(p2);
  }
  addLabel('🔁 '+(d.flywheel||''),(fx1+fx2)/2,top+18,'fly');
}

function drawMetroConnections(cards,d){
  var points=cards.map(function(c){ return {x:c.x+26,y:c.y+26}; });
  if(!points.length)return;
  var route='M'+points[0].x+','+points[0].y;
  for(var i=1;i<points.length;i++){
    var prev=points[i-1], next=points[i], mx=(prev.x+next.x)/2;
    route+=' C'+mx+','+prev.y+' '+mx+','+next.y+' '+next.x+','+next.y;
  }
  var halo=document.createElementNS('http://www.w3.org/2000/svg','path');
  halo.setAttribute('d',route); halo.setAttribute('fill','none'); halo.setAttribute('stroke','#fff'); halo.setAttribute('stroke-width','22'); halo.setAttribute('stroke-linecap','round'); svg.appendChild(halo);
  var line=document.createElementNS('http://www.w3.org/2000/svg','path');
  line.setAttribute('d',route); line.setAttribute('fill','none'); line.setAttribute('stroke','#f0523e'); line.setAttribute('stroke-width','12'); line.setAttribute('stroke-linecap','round'); svg.appendChild(line);
  points.forEach(function(point,i){
    var station=document.createElementNS('http://www.w3.org/2000/svg','circle');
    station.setAttribute('cx',point.x); station.setAttribute('cy',point.y); station.setAttribute('r','19'); station.setAttribute('fill','#fff'); station.setAttribute('stroke','#f0523e'); station.setAttribute('stroke-width','7'); svg.appendChild(station);
    if(i<points.length-1 && cards[i].arrow) addLabel(cards[i].arrow,(point.x+points[i+1].x)/2,Math.min(point.y,points[i+1].y)-34,'metro-transfer');
  });
  var last=points[points.length-1], mid=points[Math.min(2,points.length-1)];
  if(last&&mid){
    var loop=document.createElementNS('http://www.w3.org/2000/svg','path');
    loop.setAttribute('d','M'+last.x+','+(last.y-24)+' C'+last.x+','+72+' '+mid.x+','+72+' '+mid.x+','+(mid.y-24));
    loop.setAttribute('fill','none'); loop.setAttribute('stroke','#f6c847'); loop.setAttribute('stroke-width','5'); loop.setAttribute('stroke-dasharray','9 8'); loop.setAttribute('stroke-linecap','round'); svg.appendChild(loop);
    addLabel('🔁 '+(d.flywheel||''),(last.x+mid.x)/2,93,'fly');
  }
}

function drawDefaultConnections(cards,d){
  cards.forEach(function(c,i){
    if(i>=cards.length-1)return;
    var n=cards[i+1], isNewEditorialRow=state.style==='editorial'&&n.y-c.y>400;
    var x1=isNewEditorialRow?c.x+c.w/2:c.x+c.w+3;
    var y1=isNewEditorialRow?c.y+c.el.offsetHeight+8:c.y+86;
    var x2=isNewEditorialRow?n.x+n.w/2:n.x-9;
    var y2=isNewEditorialRow?n.y-12:n.y+86;
    var mx=(x1+x2)/2;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    p.setAttribute('fill','none'); p.setAttribute('stroke','var(--flow)');
    p.setAttribute('stroke-width',state.style==='bento'?'8':'2.25');
    if(state.style==='bento'){ p.setAttribute('stroke-linecap','round'); p.setAttribute('opacity','.6'); }
    else p.setAttribute('marker-end','url(#ah)');
    svg.appendChild(p);
    // bento: center the pill in the vertical band where BOTH cards flank the gap,
    // so it sits beside the cards on its connector line, never above or over them
    if(state.style!=='bento') addLabel(c.arrow,mx,(y1+y2)/2,'');
    // bento: transition text lives as an eyebrow chip INSIDE the next card (added at card build)
  });
  addFlywheel(cards,d);
}

function buildMap(){
  var d=MAPDATA, L=layerDef();
  // Per-style layout: bento breathes (Jameson 2026-07-10: room between everything)
  var LY = state.style==='bento'
    ? {W:340, G:360, M:220, S:[0,130,30,160,20,140,60], F:160}
    : {W:330, G:170, M:140, S:[0,64,18,80,10,70,32],  F:90};
  STAGE_W=LY.W; GAP_X=LY.G; MARGIN=LY.M; STAGGER=LY.S;

  var tot=countFeatures(visibleFeatures(d)), total=visibleFeatures(d).length;
  mapc.innerHTML='';
  mapc.className='theme-layout-'+state.style;
  var svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.id='arrows'; mapc.appendChild(svgEl); svg=svgEl;

  var stages=d.stages||[], cards=[], layout=themeLayout(state.style,(d.stages||[]).length);
  stages.forEach(function(p,idx){
    var rows='';
    (p.groups||[{features:p.features||[]}]).forEach(function(gr){
      var glabel=L.statuses ? gr.label : (gr.visionLabel!==undefined ? gr.visionLabel : gr.label);
      if(glabel) rows+='<li class="group"><span class="glabel">'+esc(glabel)+'</span></li>';
      var fs=(gr.features||[]).slice().sort(function(a,b){return (b.hero?1:0)-(a.hero?1:0);});
      fs.forEach(function(f){
        var st=statusAdapter(f.status).slug;
        var cls=f.hero?'hero':(fs.length>1&&fs.some(function(x){return x.hero;})?'sub':'');
        var notes='';
        if(f.note) notes+='<div class="note">'+esc(f.note)+'</div>';
        if(L.statuses&&f.statusNote) notes+='<div class="note nstatus">'+esc(f.statusNote)+'</div>';
        rows+='<li class="feat s-'+st+(cls?' '+cls:'')+'"><span class="stop" title="'+LABEL[st]+'" aria-label="'+LABEL[st]+'">'+GLYPH[st]+'</span>'+
          '<span class="body"><span class="name">'+esc(f.name)+(f.hero?'<span class="star" title="hero feature">★</span>':'')+
          (L.statuses?'<span class="badge">'+LABEL[st]+'</span>':'')+'</span>'+notes+'</span></li>';
      });
    });
    var el=document.createElement('section');
    var stepWord=state.style==='editorial'?'Chapter':(state.style==='metro'?'Station':'Step');
    el.className='stagecard stage-'+esc(p.id||String(idx));
    var inflow=(state.style==='bento'&&idx>0&&stages[idx-1].arrow)?('<div class="bento-inflow">\u2192 '+esc(stages[idx-1].arrow)+'</div>'):'';
    el.innerHTML=inflow+'<header><div class="kicker">'+stepWord+' '+p.num+'</div>'+
      '<h2><span class="picto">'+esc(p.icon||'')+'</span><span>'+esc(p.name)+'</span></h2>'+
      '<div class="story">'+esc(p.story||'')+'</div></header>'+
      '<ul class="features">'+rows+'</ul>';
    var pos=layout.positions[idx];
    var x=pos.x, y=pos.y;
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=pos.w+'px';
    mapc.appendChild(el);
    cards.push({el:el,x:x,y:y,w:pos.w,arrow:p.arrow||''});
  });

  var f=d.foundation||{features:[]};
  var chips=(f.features||[]).map(function(x){
    var st=statusAdapter(x.status).slug;
    return '<li class="s-'+st+'"><span class="stop" title="'+LABEL[st]+'">'+GLYPH[st]+'</span>'+esc(x.name)+
      (L.statuses?'<span class="foundation-status">'+GLYPH[st]+' '+LABEL[st]+'</span>':'')+
      (x.note?' <span class="note">· '+esc(x.note)+'</span>':'')+
      (L.statuses&&x.statusNote?' <span class="note">· '+esc(x.statusNote)+'</span>':'')+'</li>';
  }).join('');
  var fd=document.createElement('div');
  fd.className='foundation';
  var foundationName=state.style==='metro'?'Ground line · '+(f.name||'Private by design'):(f.name||'Private by design');
  fd.innerHTML='<h2><span>'+esc(f.icon||'🔒')+'</span>'+esc(foundationName)+'</h2>'+
    '<div class="story">'+esc(f.story||'')+'</div><ul>'+chips+'</ul>';
  mapc.appendChild(fd);

  var maxBottom=0;
  cards.forEach(function(c){ maxBottom=Math.max(maxBottom, c.y+c.el.offsetHeight); });
  var totalW=layout.worldW;
  fd.style.left=layout.foundationX+'px'; fd.style.top=(maxBottom+layout.foundationGap)+'px'; fd.style.width=layout.foundationW+'px';
  worldW=totalW; worldH=maxBottom+layout.foundationGap+fd.offsetHeight+60;
  world.style.width=totalW+'px'; world.style.height=worldH+'px';
  svg.setAttribute('width',totalW); svg.setAttribute('height',worldH);
  svg.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs>';
  if(state.style==='metro') drawMetroConnections(cards,d); else drawDefaultConnections(cards,d);

  document.getElementById('counts').innerHTML = L.statuses
    ? STATUS_LABELS.map(function(label){var a=statusAdapter(label);return '<span class="count c-'+a.slug+'">'+a.glyph+' '+tot[a.slug]+' '+esc(label)+'</span>';}).join('')
    : '<span class="count c-built-checking">✨ Future vision: '+total+' V1 features pictured here. This is not current proof.</span>';

  renderNonV1(d.nonV1Features);
}

function renderNonV1(features){
  var previous=document.getElementById('nonv1'); if(previous) previous.remove();
  if(!features.length) return;
  var aside=document.createElement('aside'); aside.id='nonv1'; aside.className='nonv1';
  aside.innerHTML='<strong>Not in V1 · '+features.length+'</strong><span>These are separate future ideas, not missing V1 work.</span><details><summary>See the names and scope notes</summary><ul>'+features.map(function(feature){return '<li><b>'+esc(feature.name)+'</b> — '+esc(typeof feature.outsideV1Reason==='string'&&feature.outsideV1Reason.trim()?feature.outsideV1Reason:'Outside the accepted V1 feature set.')+'</li>';}).join('')+'</ul></details>';
  document.body.appendChild(aside);
}

// layer picker (generated from LAYERS so future layers just work)
var layersEl=document.getElementById('layers');
LAYERS.forEach(function(L){
  var b=document.createElement('button');
  b.className='chip'+(L.id===state.layer?' active':''); b.dataset.l=L.id; b.title=L.title; b.textContent=L.name;
  b.addEventListener('click',function(){
    if(state.layer===L.id)return;
    state.layer=L.id;
    if(!L.statuses) state.filter='all';
    layersEl.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.l===L.id);});
    document.querySelectorAll('#statusfilters .chip').forEach(function(x){
      var selected=x.dataset.f===state.filter;
      x.classList.toggle('active',selected);
      x.setAttribute('aria-pressed',selected?'true':'false');
    });
    applyBodyState();
    writeHash();
    if(MAPDATA) buildMap();
  });
  layersEl.appendChild(b);
});
var stylesEl=document.getElementById('styles');
STYLES.forEach(function(S){
  var b=document.createElement('button');
  b.className='chip'+(S.id===state.style?' active':''); b.dataset.s=S.id; b.title=S.title; b.textContent=S.name;
  b.addEventListener('click',function(){
    if(state.style===S.id)return;
    state.style=S.id;
    stylesEl.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.s===S.id);});
    applyBodyState();
    writeHash();
    if(MAPDATA){ buildMap(); if(fitMap) fitMap(); }
  });
  stylesEl.appendChild(b);
});
applyBodyState();

fetch('feature-map-data.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('status '+r.status);return r.text();}).then(verifyFeatureMapPayload).then(function(d){
  var verdict=validateMapData(d);
  if(!verdict.ok) throw new Error(verdict.error);
  MAPDATA=d;
  buildMap();
  var hashPrefix=d.input_hash.slice(0,12);
  var updated=document.getElementById('updated');
  updated.dataset.inputHash=d.input_hash;
  updated.dataset.requirementV1Count=String(d.requirementUniverse.v1.length);
  updated.dataset.requirementOutsideV1Count=String(d.requirementUniverse.outside_v1.length);
  updated.dataset.requirementSourceSplit='Wealthbox 151, Jump 63, shared 24';
  updated.textContent='Generated '+(d.updated||'unknown date')+' · input '+hashPrefix+'... · renderer four-label-v1';

  // ── pan/zoom (open-source panzoom by @anvaka, inlined above) ──
  function ignorePan(e){
    var t=e.target;
    return !!(t && t.closest && t.closest('.cnote,.composer,button,textarea,input,a'));
  }
  pz=panzoom(world,{maxZoom:2.5, minZoom:0.12, zoomDoubleClickSpeed:1.9, smoothScroll:false,
    beforeMouseDown:ignorePan,
    onTouch:function(e){return !ignorePan(e);}});
  var vp=document.getElementById('viewport');
  vp.addEventListener('pointerdown',function(){vp.classList.add('panning');});
  window.addEventListener('pointerup',function(){vp.classList.remove('panning');});
  function pct(){var s=pz.getTransform().scale; document.getElementById('zpct').textContent=Math.round(s*100)+'%';}
  pz.on('transform',pct);
  function fit(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var s=Math.min(vw/(worldW+40), (vh-140)/(worldH+40));
    s=Math.max(Math.min(s,2.5),0.12);
    pz.zoomAbs(0,0,s);
    pz.moveTo((vw-worldW*s)/2, 90+(vh-140-worldH*s)/2);
    pct();
  }
  fitMap=fit;
  function zoomBy(f){
    var t=pz.getTransform();
    var s=Math.max(0.12, Math.min(2.5, t.scale*f));
    pz.zoomAbs(window.innerWidth/2, window.innerHeight/2, s);
    pct();
  }
  document.getElementById('zin').addEventListener('click',function(){zoomBy(1.25);});
  document.getElementById('zout').addEventListener('click',function(){zoomBy(0.8);});
  document.getElementById('zfit').addEventListener('click',fit);
  fit();

  // ── comments: sticky notes anyone (with a login) can pin to the board ──
  function fmtWhen(iso){
    try{ var d2=new Date(iso); return d2.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d2.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function renderNote(cm){
    var n=document.createElement('div'); n.className='cnote'; n.dataset.id=cm.id;
    n.style.left=cm.x+'px'; n.style.top=cm.y+'px';
    n.innerHTML='<div class="nhead"><b>'+esc(cm.author)+'</b><span class="ntime">'+esc(fmtWhen(cm.ts))+'</span>'+
      '<button class="ndel" title="Delete this note" aria-label="Delete">×</button></div>'+
      '<div class="ntext">'+esc(cm.text)+'</div>';
    n.querySelector('.ndel').addEventListener('click',function(){
      if(!confirm('Delete this note?'))return;
      fetch('/api/feature-map/comments/'+encodeURIComponent(cm.id),{method:'DELETE'})
        .then(function(r){ if(r.ok) n.remove(); });
    });
    world.appendChild(n);
  }
  fetch('/api/feature-map/comments').then(function(r){return r.ok?r.json():[];}).then(function(list){
    (list||[]).forEach(renderNote);
  }).catch(function(){});

  var cmodeBtn=document.getElementById('cmode');
  var composer=null;
  function exitCommentMode(){ document.body.classList.remove('commenting'); cmodeBtn.classList.remove('active'); }
  cmodeBtn.addEventListener('click',function(){
    if(document.body.classList.contains('commenting')){ exitCommentMode(); }
    else{ document.body.classList.add('commenting'); cmodeBtn.classList.add('active'); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeComposer(); exitCommentMode(); } });

  function closeComposer(){ if(composer){ if(composer._rec){ try{composer._rec.stop();}catch(e){} } composer.remove(); composer=null; } }
  function openComposer(wx,wy){
    closeComposer();
    var c=document.createElement('div'); c.className='composer';
    c.style.left=wx+'px'; c.style.top=wy+'px';
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    c.innerHTML='<textarea placeholder="Type your comment — or tap the mic and just talk"></textarea>'+
      '<div class="crow"><input class="cname" placeholder="Your name" maxlength="60">'+
      (SR?'<button class="mic" title="Speak your comment">🎤</button>':'')+
      '<button class="ccancel">Cancel</button><button class="csave">Post</button></div>';
    world.appendChild(c); composer=c;
    var ta=c.querySelector('textarea'), nameEl=c.querySelector('.cname');
    nameEl.value=localStorage.getItem('fmap-name')||'';
    ta.focus();
    if(SR){
      var mic=c.querySelector('.mic'), rec=null;
      mic.addEventListener('click',function(){
        if(rec){ try{rec.stop();}catch(e){} return; }
        rec=new SR(); c._rec=rec;
        rec.continuous=true; rec.interimResults=false; rec.lang='en-US';
        rec.onresult=function(ev){
          for(var i=ev.resultIndex;i<ev.results.length;i++){
            if(ev.results[i].isFinal){ ta.value=(ta.value?ta.value+' ':'')+ev.results[i][0].transcript.trim(); }
          }
        };
        rec.onend=function(){ mic.classList.remove('rec'); rec=null; c._rec=null; };
        rec.onerror=function(){ mic.classList.remove('rec'); };
        try{ rec.start(); mic.classList.add('rec'); }catch(e){}
      });
    }
    c.querySelector('.ccancel').addEventListener('click',closeComposer);
    c.querySelector('.csave').addEventListener('click',function(){
      var text=ta.value.trim();
      if(!text){ ta.focus(); return; }
      var author=nameEl.value.trim()||'Anonymous';
      localStorage.setItem('fmap-name',author);
      fetch('/api/feature-map/comments',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({x:wx,y:wy,text:text,author:author})})
        .then(function(r){ if(!r.ok) throw new Error('save failed'); return r.json(); })
        .then(function(cm){ closeComposer(); exitCommentMode(); renderNote(cm); })
        .catch(function(){ alert('Could not save the note — check your connection and try again.'); });
    });
  }
  var downX=0, downY=0;
  vp.addEventListener('pointerdown',function(e){ downX=e.clientX; downY=e.clientY; });
  vp.addEventListener('pointerup',function(e){
    if(!document.body.classList.contains('commenting'))return;
    if(Math.abs(e.clientX-downX)>6||Math.abs(e.clientY-downY)>6)return; // was a drag
    if(e.target.closest('.cnote,.composer,button,textarea,input'))return;
    var t=pz.getTransform();
    openComposer((e.clientX-t.x)/t.scale, (e.clientY-t.y)/t.scale);
  });
}).catch(function(e){
  var er=document.createElement('div'); er.className='error';
  er.innerHTML='<div>Could not load the map ('+esc(e.message)+'). Check that <code>feature-map-data.json</code> sits next to this page.</div>';
  document.body.appendChild(er);
});

document.querySelectorAll('#statusfilters .chip').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#statusfilters .chip').forEach(function(x){x.classList.remove('active');x.setAttribute('aria-pressed','false');});
    b.classList.add('active');
    b.setAttribute('aria-pressed','true');
    state.filter=b.dataset.f;
    applyBodyState();
  });
});
</script>

     map links preserve both as #layer=vision&style=metro. Per-feature `statusNote` and per-group
