<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Feature Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf9f6; --dot:#dcd7cc;
    --card:#ffffff; --line:#e7e2d8; --line-soft:#efebe2;
    --ink:#292520; --ink-soft:#6f6a60; --ink-mute:#98917f;
    --gold:#c07c18; --gold-soft:#f7ead2;
    --live:#177a53; --live-bg:#e5f3ec;
    --build:#a26400; --build-bg:#faf0dc;
    --plan:#67788f; --plan-bg:#eceff4;
    --flow:#cfc8b8;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Albert Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{font-family:var(--sans); background:var(--paper); color:var(--ink)}

  /* ── the board ─────────────────────────────────────────── */
  #viewport{position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none}
  #viewport.panning{cursor:grabbing}
  #world{position:absolute; top:0; left:0; transform-origin:0 0;
    background-image:radial-gradient(circle, var(--dot) 1.4px, transparent 1.5px);
    background-size:34px 34px}
  #arrows{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}

  /* ── floating chrome ───────────────────────────────────── */
  .hud{position:fixed; z-index:20; font-size:13px}
  .hud-top{top:18px; left:20px; right:20px; display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; pointer-events:none}
  .hud-top>*{pointer-events:auto}
  .titlecard{background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:16px; padding:14px 18px 13px; box-shadow:0 10px 30px rgba(41,37,32,.08); max-width:430px}
  .titlecard h1{font-family:var(--serif); font-weight:640; font-size:21px; letter-spacing:.1px; display:flex; align-items:center; gap:9px}
  .titlecard p{margin-top:4px; color:var(--ink-soft); font-size:12.8px; line-height:1.45}
  .titlecard .counts{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap}
  .count{border-radius:999px; padding:3px 10px; font-weight:600; font-size:11.5px; border:1px solid}
  .count.c-live{color:var(--live); background:var(--live-bg); border-color:#cfe7db}
  .count.c-build{color:var(--build); background:var(--build-bg); border-color:#eeddb9}
  .count.c-plan{color:var(--plan); background:var(--plan-bg); border-color:#dbe1ea}
  .filters{display:flex; gap:7px; flex-wrap:wrap; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; padding:6px; box-shadow:0 10px 30px rgba(41,37,32,.08); height:fit-content}
  .chip{font:inherit; font-size:12.5px; font-weight:600; border:none; background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
  .chip:hover{background:#f3f0e9}
  .chip.active{background:var(--ink); color:#fff}
  .chip .dot{width:8px; height:8px; border-radius:50%}
  .hud-hint{position:fixed; top:18px; right:20px; z-index:20; color:var(--ink-mute); font-size:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(8px); border:1px solid var(--line-soft); border-radius:999px; padding:6px 13px}
  .hud-zoom{bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:2px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; padding:5px; box-shadow:0 12px 34px rgba(41,37,32,.12)}
  .hud-zoom button{font:inherit; font-size:15px; font-weight:600; width:34px; height:34px; border:none; background:transparent; color:var(--ink); border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center}
  .hud-zoom button:hover{background:#f3f0e9}
  .hud-zoom .pct{min-width:52px; text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .hud-zoom .fit{width:auto; padding:0 14px; font-size:12.5px}
  .hud-zoom .sep{width:1px; height:20px; background:var(--line); margin:0 3px}
  .updated{position:fixed; bottom:22px; right:20px; z-index:20; color:var(--ink-mute); font-size:11.5px}

  /* ── stage cards ───────────────────────────────────────── */
  .stagecard{position:absolute; width:330px; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 40px rgba(41,37,32,.07), 0 2px 6px rgba(41,37,32,.04)}
  .stagecard header{padding:18px 18px 14px; border-bottom:1px solid var(--line-soft)}
  .kicker{font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold)}
  .stagecard h2{font-family:var(--serif); font-weight:640; font-size:19px; margin-top:5px; display:flex; gap:9px; align-items:baseline}
  .stagecard h2 .picto{font-size:16px}
  .stagecard .story{margin-top:6px; font-size:12.6px; color:var(--ink-soft); line-height:1.5}
  ul.features{list-style:none; padding:12px 16px 18px}
  li.group{border-top:1px solid var(--line-soft); padding-top:14px; margin-top:16px}
  li.group:first-child{border-top:none; padding-top:0; margin-top:2px}
  li.group .glabel{font-size:13.5px; font-weight:700; color:var(--ink)}
  li.feat{display:flex; gap:10px; align-items:flex-start; padding:8px 2px 8px 0; border-radius:10px; transition:opacity .25s}
  .stop{flex:none; width:21px; height:21px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; border:2px solid; background:#fff; margin-top:1px}
  .s-shipped .stop{color:var(--live); border-color:var(--live); background:var(--live-bg)}
  .s-building .stop{color:var(--build); border-color:var(--build); background:var(--build-bg)}
  .s-planned .stop{color:var(--plan); border-color:var(--plan); background:var(--plan-bg)}
  .feat .name{font-size:13.2px; font-weight:600; line-height:1.4}
  .s-planned .name{color:#4d5a70}
  .feat .note{font-size:11.8px; color:var(--ink-mute); margin-top:2px; line-height:1.45}
  .feat .badge{display:none; font-size:9.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; border-radius:5px; padding:1px 6px; margin-left:7px; vertical-align:1px}
  .s-building .badge{display:inline-block; color:var(--build); background:var(--build-bg)}
  .s-planned .badge{display:inline-block; color:var(--plan); background:var(--plan-bg)}
  li.feat.hero{background:linear-gradient(135deg,#fffdf8,#fdf6e8); border:1px solid #f0e3c6; border-radius:12px; padding:10px 10px 10px 8px; margin:2px 0}
  li.feat.hero .name{font-size:14.2px; font-weight:750}
  li.feat.hero .star{color:var(--gold); font-size:12px; margin-left:6px}
  li.feat.sub{padding-left:8px}
  li.feat.sub .stop{width:17px; height:17px; font-size:9px}
  li.feat.sub .name{font-weight:500; font-size:12.7px}

  /* arrow labels */
  .alabel{position:absolute; transform:translate(-50%,-50%); background:#fffdf9; border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:4px 12px; font-size:11.3px; white-space:nowrap; box-shadow:0 4px 14px rgba(41,37,32,.06)}
  .alabel.fly{color:var(--gold); border-color:#ecd9b4; background:#fffaf0; max-width:520px; white-space:normal; text-align:center; line-height:1.4}

  /* ── foundation band ───────────────────────────────────── */
  .foundation{position:absolute; background:linear-gradient(170deg,#2a2620,#39332a); border-radius:20px; color:#fff; padding:22px 26px; box-shadow:0 18px 50px rgba(41,37,32,.18)}
  .foundation h2{font-family:var(--serif); font-weight:640; font-size:18px; display:flex; gap:9px; align-items:center}
  .foundation .story{font-size:12.6px; color:#cbc2b2; margin-top:5px}
  .foundation ul{list-style:none; display:flex; flex-wrap:wrap; gap:10px; margin-top:15px}
  .foundation li{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:6px 14px 6px 8px; font-size:12.4px; font-weight:600; transition:opacity .25s}
  .foundation li .stop{width:18px; height:18px; font-size:9px; border-width:2px}
  .foundation li .note{font-weight:400; color:#b3a992; font-size:11.3px}

  body.f-shipped li.feat:not(.s-shipped), body.f-building li.feat:not(.s-building), body.f-planned li.feat:not(.s-planned),
  body.f-shipped .foundation li:not(.s-shipped), body.f-building .foundation li:not(.s-building), body.f-planned .foundation li:not(.s-planned){opacity:.14}

  /* ── comments ──────────────────────────────────────────── */
  body.commenting #viewport{cursor:crosshair}
  .hud-zoom .cmode.active{background:var(--gold); color:#fff}
  .cnote,.composer{position:absolute; z-index:5; width:230px; background:#fff8dd; border:1px solid #ecd98f; border-radius:4px 14px 14px 14px; box-shadow:0 10px 26px rgba(41,37,32,.16); padding:10px 12px 11px; font-size:12.6px}
  .cnote::before,.composer::before{content:"💬"; position:absolute; top:-13px; left:-13px; width:26px; height:26px; background:var(--gold); border-radius:50% 50% 50% 4px; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 4px 10px rgba(41,37,32,.25)}
  .cnote .nhead{display:flex; align-items:baseline; gap:7px; margin-bottom:4px}
  .cnote .nhead b{font-size:12.2px}
  .cnote .ntime{color:#a08d4e; font-size:10.8px; flex:1}
  .cnote .ndel{border:none; background:none; color:#b3a05e; cursor:pointer; font-size:14px; line-height:1; padding:2px}
  .cnote .ndel:hover{color:#8a2222}
  .cnote .ntext{line-height:1.5; white-space:pre-wrap; word-wrap:break-word}
  .composer textarea{width:100%; min-height:76px; border:1px solid #e2cd7f; border-radius:8px; background:#fffdf2; font:inherit; padding:8px; resize:vertical; outline:none}
  .composer textarea:focus{border-color:var(--gold)}
  .composer .crow{display:flex; gap:6px; align-items:center; margin-top:7px}
  .composer .cname{flex:1; min-width:0; border:1px solid #e2cd7f; border-radius:8px; background:#fffdf2; font:inherit; font-size:11.8px; padding:5px 8px; outline:none}
  .composer button{font:inherit; font-size:12px; font-weight:600; border:none; border-radius:8px; padding:6px 10px; cursor:pointer}
  .composer .mic{background:#f3e8c0}
  .composer .mic.rec{background:#e05a4e; color:#fff; animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .composer .ccancel{background:transparent; color:var(--ink-soft)}
  .composer .csave{background:var(--ink); color:#fff; padding:6px 14px}
  .hint-comment{position:fixed; top:64px; right:20px; z-index:20; background:var(--gold); color:#fff; border-radius:999px; padding:7px 15px; font-size:12.5px; box-shadow:0 8px 22px rgba(192,124,24,.35); display:none}
  body.commenting .hint-comment{display:block}
  body.layer-vision #statusfilters{display:none}
  .error{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:30}
  .error>div{background:#fdeaea; border:1px solid #f2c4c4; color:#8a2222; border-radius:14px; padding:18px 22px; font-size:14px}
  @media (max-width:700px){ .hud-hint{display:none} .titlecard{max-width:78vw} }
</style>
</head>
<body>

<div id="viewport"><div id="world"><div id="mapcontent"></div></div></div>

<div class="hud hud-top">
  <div class="titlecard">
    <h1><span>🗺️</span> Lantern Feature Map</h1>
    <p>The whole product as one journey, left to right — every feature at its place in an advisor's day. Privacy is the floor it all stands on.</p>
    <div class="counts" id="counts"></div>
  </div>
  <div class="filters layers" id="layers" role="group" aria-label="Layers"></div>
  <div class="filters" id="statusfilters" role="group" aria-label="Filter by status">
    <button class="chip active" data-f="all">All</button>
    <button class="chip" data-f="shipped"><span class="dot" style="background:var(--live)"></span>✓ Live now</button>
    <button class="chip" data-f="building"><span class="dot" style="background:var(--build)"></span>◐ Being built</button>
    <button class="chip" data-f="planned"><span class="dot" style="background:var(--plan)"></span>○ Planned</button>
  </div>
</div>
<div class="hud-hint">✋ drag to move around · scroll to zoom · double-click to zoom in</div>
<div class="hud hud-zoom">
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <span class="pct" id="zpct">100%</span>
  <button id="zin" title="Zoom in" aria-label="Zoom in">＋</button>
  <span class="sep"></span>
  <button class="fit" id="zfit" title="Fit the whole map on screen">Fit map</button>
  <span class="sep"></span>
  <button class="fit cmode" id="cmode" title="Click anywhere on the map to leave a note">💬 Comment</button>
</div>
<div class="hint-comment">Now click anywhere on the map to pin your comment</div>
<div class="updated" id="updated"></div>

<script>
var GLYPH={shipped:'✓', building:'◐', planned:'○'};
var LABEL={shipped:'Live now', building:'Being built', planned:'Planned'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ── LAYERS ──────────────────────────────────────────────────────────────────
// A layer is a way of looking at the same map. Add one here and it appears in
// the picker automatically. Fields a layer can use:
//   statuses:false → every feature renders as done: green check, no badges,
//                    no status filters, and per-feature `statusNote` + per-group
//                    `visionLabel` from the data are applied.
var LAYERS=[
  {id:'today',  name:'🚦 Today',      title:'What is live, being built, and planned', statuses:true},
  {id:'vision', name:'✨ The vision', title:'The finished product — everything built', statuses:false}
];
var state={layer:'today', filter:'all'};
function applyBodyState(){
  var cls=[];
  if(state.filter!=='all') cls.push('f-'+state.filter);
  if(state.layer!=='today') cls.push('layer-'+state.layer);
  document.body.className=cls.join(' ');
}

var world=document.getElementById('world');
var mapc=document.getElementById('mapcontent');
var svg=document.getElementById('arrows');
var STAGE_W=330, GAP_X=170, MARGIN=140;
var STAGGER=[0,64,18,80,10,70,32];
var MAPDATA=null, worldW=0, worldH=0, pz=null;

function layerDef(){ for(var i=0;i<LAYERS.length;i++){ if(LAYERS[i].id===state.layer) return LAYERS[i]; } return LAYERS[0]; }

function buildMap(){
  var d=MAPDATA, L=layerDef();
  var tot={shipped:0,building:0,planned:0}, total=0;
  mapc.innerHTML='';
  var svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.id='arrows'; mapc.appendChild(svgEl); svg=svgEl;

  var stages=d.stages||[], cards=[];
  stages.forEach(function(p,idx){
    var rows='';
    (p.groups||[{features:p.features||[]}]).forEach(function(gr){
      var glabel=L.statuses ? gr.label : (gr.visionLabel!==undefined ? gr.visionLabel : gr.label);
      if(glabel) rows+='<li class="group"><span class="glabel">'+esc(glabel)+'</span></li>';
      var fs=(gr.features||[]).slice().sort(function(a,b){return (b.hero?1:0)-(a.hero?1:0);});
      fs.forEach(function(f){
        var real=f.status||'planned'; tot[real]=(tot[real]||0)+1; total++;
        var st=L.statuses?real:'shipped';
        var cls=f.hero?'hero':(fs.length>1&&fs.some(function(x){return x.hero;})?'sub':'');
        var notes='';
        if(f.note) notes+='<div class="note">'+esc(f.note)+'</div>';
        if(L.statuses&&f.statusNote) notes+='<div class="note nstatus">'+esc(f.statusNote)+'</div>';
        rows+='<li class="feat s-'+st+(cls?' '+cls:'')+'"><span class="stop" title="'+LABEL[st]+'" aria-label="'+LABEL[st]+'">'+GLYPH[st]+'</span>'+
          '<span class="body"><span class="name">'+esc(f.name)+(f.hero?'<span class="star" title="hero feature">★</span>':'')+
          (L.statuses?'<span class="badge">'+LABEL[st]+'</span>':'')+'</span>'+notes+'</span></li>';
      });
    });
    var el=document.createElement('section');
    el.className='stagecard';
    el.innerHTML='<header><div class="kicker">Step '+p.num+'</div>'+
      '<h2><span class="picto">'+esc(p.icon||'')+'</span><span>'+esc(p.name)+'</span></h2>'+
      '<div class="story">'+esc(p.story||'')+'</div></header>'+
      '<ul class="features">'+rows+'</ul>';
    var x=MARGIN+idx*(STAGE_W+GAP_X), y=MARGIN+STAGGER[idx%STAGGER.length];
    el.style.left=x+'px'; el.style.top=y+'px';
    mapc.appendChild(el);
    cards.push({el:el,x:x,y:y,arrow:p.arrow||''});
  });

  var f=d.foundation||{features:[]};
  var chips=(f.features||[]).map(function(x){
    var real=x.status||'planned'; tot[real]=(tot[real]||0)+1; total++;
    var st=L.statuses?real:'shipped';
    return '<li class="s-'+st+'"><span class="stop" title="'+LABEL[st]+'">'+GLYPH[st]+'</span>'+esc(x.name)+
      (x.note?' <span class="note">· '+esc(x.note)+'</span>':'')+
      (L.statuses&&x.statusNote?' <span class="note">· '+esc(x.statusNote)+'</span>':'')+'</li>';
  }).join('');
  var fd=document.createElement('div');
  fd.className='foundation';
  fd.innerHTML='<h2><span>'+esc(f.icon||'🔒')+'</span>'+esc(f.name||'Private by design')+'</h2>'+
    '<div class="story">'+esc(f.story||'')+'</div><ul>'+chips+'</ul>';
  mapc.appendChild(fd);

  var maxBottom=0;
  cards.forEach(function(c){ maxBottom=Math.max(maxBottom, c.y+c.el.offsetHeight); });
  var totalW=MARGIN*2+stages.length*STAGE_W+(stages.length-1)*GAP_X;
  fd.style.left=MARGIN+'px'; fd.style.top=(maxBottom+90)+'px'; fd.style.width=(totalW-MARGIN*2)+'px';
  worldW=totalW; worldH=maxBottom+90+fd.offsetHeight+60;
  world.style.width=totalW+'px'; world.style.height=worldH+'px';
  svg.setAttribute('width',totalW); svg.setAttribute('height',worldH);
  svg.innerHTML='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--flow)"/></marker></defs>';

  cards.forEach(function(c,i){
    if(i>=cards.length-1)return;
    var n=cards[i+1];
    var y1=c.y+86, y2=n.y+86, mx=(c.x+STAGE_W+n.x)/2;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M'+(c.x+STAGE_W+3)+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+(n.x-9)+','+y2);
    p.setAttribute('fill','none'); p.setAttribute('stroke','var(--flow)'); p.setAttribute('stroke-width','2.25');
    p.setAttribute('marker-end','url(#ah)');
    svg.appendChild(p);
    if(c.arrow){
      var lb=document.createElement('div'); lb.className='alabel'; lb.textContent=c.arrow;
      lb.style.left=mx+'px'; lb.style.top=((y1+y2)/2)+'px';
      mapc.appendChild(lb);
    }
  });
  var last=cards[cards.length-1], mid=cards[2];
  if(last&&mid){
    var fx1=last.x+STAGE_W/2, fy1=last.y-6, fx2=mid.x+STAGE_W/2, fy2=mid.y-6, top=Math.min(fy1,fy2)-84;
    var p2=document.createElementNS('http://www.w3.org/2000/svg','path');
    p2.setAttribute('d','M'+fx1+','+fy1+' C'+fx1+','+top+' '+fx2+','+top+' '+fx2+','+fy2);
    p2.setAttribute('fill','none'); p2.setAttribute('stroke','#dfc79a'); p2.setAttribute('stroke-width','2.25');
    p2.setAttribute('stroke-dasharray','7 7'); p2.setAttribute('marker-end','url(#ah)');
    svg.appendChild(p2);
    var lb2=document.createElement('div'); lb2.className='alabel fly'; lb2.textContent='🔁 '+(d.flywheel||'');
    lb2.style.left=((fx1+fx2)/2)+'px'; lb2.style.top=(top+18)+'px';
    mapc.appendChild(lb2);
  }

  document.getElementById('counts').innerHTML = L.statuses
    ? '<span class="count c-live">✓ '+tot.shipped+' live now</span><span class="count c-build">◐ '+tot.building+' being built</span><span class="count c-plan">○ '+tot.planned+' planned</span>'
    : '<span class="count c-live">✨ all '+total+' features, as one finished product</span>';
}

// layer picker (generated from LAYERS so future layers just work)
var layersEl=document.getElementById('layers');
LAYERS.forEach(function(L){
  var b=document.createElement('button');
  b.className='chip'+(L.id===state.layer?' active':''); b.dataset.l=L.id; b.title=L.title; b.textContent=L.name;
  b.addEventListener('click',function(){
    if(state.layer===L.id)return;
    state.layer=L.id;
    if(!L.statuses) state.filter='all';
    layersEl.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.l===L.id);});
    document.querySelectorAll('.filters .chip').forEach(function(x){x.classList.toggle('active',x.dataset.f===state.filter);});
    applyBodyState();
    try{history.replaceState(null,'','#layer='+L.id);}catch(e){}
    if(MAPDATA) buildMap();
  });
  layersEl.appendChild(b);
});
var hm=(location.hash||'').match(/layer=([a-z]+)/);
if(hm && LAYERS.some(function(L){return L.id===hm[1];}) && hm[1]!==state.layer){ state.layer=hm[1];
  layersEl.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',x.dataset.l===state.layer);});
}
applyBodyState();

fetch('feature-map-data.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('status '+r.status);return r.json();}).then(function(d){
  MAPDATA=d;
  buildMap();
  document.getElementById('updated').textContent='Last updated '+(d.updated||'');

  // ── pan/zoom (open-source panzoom by @anvaka, inlined above) ──
  function ignorePan(e){
    var t=e.target;
    return !!(t && t.closest && t.closest('.cnote,.composer,button,textarea,input,a'));
  }
  pz=panzoom(world,{maxZoom:2.5, minZoom:0.12, zoomDoubleClickSpeed:1.9, smoothScroll:false,
    beforeMouseDown:ignorePan,
    onTouch:function(e){return !ignorePan(e);}});
  var vp=document.getElementById('viewport');
  vp.addEventListener('pointerdown',function(){vp.classList.add('panning');});
  window.addEventListener('pointerup',function(){vp.classList.remove('panning');});
  function pct(){var s=pz.getTransform().scale; document.getElementById('zpct').textContent=Math.round(s*100)+'%';}
  pz.on('transform',pct);
  function fit(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var s=Math.min(vw/(worldW+40), (vh-140)/(worldH+40));
    s=Math.max(Math.min(s,2.5),0.12);
    pz.zoomAbs(0,0,s);
    pz.moveTo((vw-worldW*s)/2, 90+(vh-140-worldH*s)/2);
    pct();
  }
  function zoomBy(f){
    var t=pz.getTransform();
    var s=Math.max(0.12, Math.min(2.5, t.scale*f));
    pz.zoomAbs(window.innerWidth/2, window.innerHeight/2, s);
    pct();
  }
  document.getElementById('zin').addEventListener('click',function(){zoomBy(1.25);});
  document.getElementById('zout').addEventListener('click',function(){zoomBy(0.8);});
  document.getElementById('zfit').addEventListener('click',fit);
  fit();

  // ── comments: sticky notes anyone (with a login) can pin to the board ──
  function fmtWhen(iso){
    try{ var d2=new Date(iso); return d2.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d2.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function renderNote(cm){
    var n=document.createElement('div'); n.className='cnote'; n.dataset.id=cm.id;
    n.style.left=cm.x+'px'; n.style.top=cm.y+'px';
    n.innerHTML='<div class="nhead"><b>'+esc(cm.author)+'</b><span class="ntime">'+esc(fmtWhen(cm.ts))+'</span>'+
      '<button class="ndel" title="Delete this note" aria-label="Delete">×</button></div>'+
      '<div class="ntext">'+esc(cm.text)+'</div>';
    n.querySelector('.ndel').addEventListener('click',function(){
      if(!confirm('Delete this note?'))return;
      fetch('/api/feature-map/comments/'+encodeURIComponent(cm.id),{method:'DELETE'})
        .then(function(r){ if(r.ok) n.remove(); });
    });
    world.appendChild(n);
  }
  fetch('/api/feature-map/comments').then(function(r){return r.ok?r.json():[];}).then(function(list){
    (list||[]).forEach(renderNote);
  }).catch(function(){});

  var cmodeBtn=document.getElementById('cmode');
  var composer=null;
  function exitCommentMode(){ document.body.classList.remove('commenting'); cmodeBtn.classList.remove('active'); }
  cmodeBtn.addEventListener('click',function(){
    if(document.body.classList.contains('commenting')){ exitCommentMode(); }
    else{ document.body.classList.add('commenting'); cmodeBtn.classList.add('active'); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeComposer(); exitCommentMode(); } });

  function closeComposer(){ if(composer){ if(composer._rec){ try{composer._rec.stop();}catch(e){} } composer.remove(); composer=null; } }
  function openComposer(wx,wy){
    closeComposer();
    var c=document.createElement('div'); c.className='composer';
    c.style.left=wx+'px'; c.style.top=wy+'px';
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    c.innerHTML='<textarea placeholder="Type your comment — or tap the mic and just talk"></textarea>'+
      '<div class="crow"><input class="cname" placeholder="Your name" maxlength="60">'+
      (SR?'<button class="mic" title="Speak your comment">🎤</button>':'')+
      '<button class="ccancel">Cancel</button><button class="csave">Post</button></div>';
    world.appendChild(c); composer=c;
    var ta=c.querySelector('textarea'), nameEl=c.querySelector('.cname');
    nameEl.value=localStorage.getItem('fmap-name')||'';
    ta.focus();
    if(SR){
      var mic=c.querySelector('.mic'), rec=null;
      mic.addEventListener('click',function(){
        if(rec){ try{rec.stop();}catch(e){} return; }
        rec=new SR(); c._rec=rec;
        rec.continuous=true; rec.interimResults=false; rec.lang='en-US';
        rec.onresult=function(ev){
          for(var i=ev.resultIndex;i<ev.results.length;i++){
            if(ev.results[i].isFinal){ ta.value=(ta.value?ta.value+' ':'')+ev.results[i][0].transcript.trim(); }
          }
        };
        rec.onend=function(){ mic.classList.remove('rec'); rec=null; c._rec=null; };
        rec.onerror=function(){ mic.classList.remove('rec'); };
        try{ rec.start(); mic.classList.add('rec'); }catch(e){}
      });
    }
    c.querySelector('.ccancel').addEventListener('click',closeComposer);
    c.querySelector('.csave').addEventListener('click',function(){
      var text=ta.value.trim();
      if(!text){ ta.focus(); return; }
      var author=nameEl.value.trim()||'Anonymous';
      localStorage.setItem('fmap-name',author);
      fetch('/api/feature-map/comments',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({x:wx,y:wy,text:text,author:author})})
        .then(function(r){ if(!r.ok) throw new Error('save failed'); return r.json(); })
        .then(function(cm){ closeComposer(); exitCommentMode(); renderNote(cm); })
        .catch(function(){ alert('Could not save the note — check your connection and try again.'); });
    });
  }
  var downX=0, downY=0;
  vp.addEventListener('pointerdown',function(e){ downX=e.clientX; downY=e.clientY; });
  vp.addEventListener('pointerup',function(e){
    if(!document.body.classList.contains('commenting'))return;
    if(Math.abs(e.clientX-downX)>6||Math.abs(e.clientY-downY)>6)return; // was a drag
    if(e.target.closest('.cnote,.composer,button,textarea,input'))return;
    var t=pz.getTransform();
    openComposer((e.clientX-t.x)/t.scale, (e.clientY-t.y)/t.scale);
  });
}).catch(function(e){
  var er=document.createElement('div'); er.className='error';
  er.innerHTML='<div>Could not load the map ('+esc(e.message)+'). Check that <code>feature-map-data.json</code> sits next to this page.</div>';
  document.body.appendChild(er);
});

document.querySelectorAll('.filters .chip').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.filters .chip').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    state.filter=b.dataset.f;
    applyBodyState();
  });
});
