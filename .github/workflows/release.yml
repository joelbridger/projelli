name: Release Tauri builds

# Triggered on tag push (e.g. `git tag v1.0.2 && git push --tags`).
# Builds Tauri installers for Windows, macOS (Intel + Apple Silicon), and Linux,
# then publishes them as a draft GitHub Release.
#
# After the workflow finishes:
#   1. Go to https://github.com/projelli/projelli/releases
#   2. Find the draft release
#   3. Edit the description with the changelog from CHANGELOG.md
#   4. Click "Publish release"
#
# All required GitHub Secrets are wired in as of 2026-04-09.
#
#   macOS code signing + notarization:
#     APPLE_CERTIFICATE                base64-encoded .p12 of Developer ID Application cert
#     APPLE_CERTIFICATE_PASSWORD       password used when exporting the .p12
#     APPLE_SIGNING_IDENTITY           "Developer ID Application: Jameson Daines (7HCXDCS279)"
#     APPLE_ID                         jamesondaines@outlook.com
#     APPLE_PASSWORD                   app-specific password for notarization
#     APPLE_TEAM_ID                    7HCXDCS279
#
#   Windows code signing via Azure Trusted/Artifact Signing:
#     AZURE_TENANT_ID                  Entra tenant ID
#     AZURE_CLIENT_ID                  service principal app id (projelli-github-actions)
#     AZURE_CLIENT_SECRET              service principal client secret
#     AZURE_TRUSTED_SIGNING_ENDPOINT   region endpoint, e.g. https://eus.codesigning.azure.net/
#     AZURE_TRUSTED_SIGNING_ACCOUNT    artifact signing account name (projelli-signing)
#     AZURE_TRUSTED_SIGNING_CERT_PROFILE  certificate profile name (projelli-public-trust)
#
# Tauri's signCommand in tauri.conf.json invokes AzureSignTool to sign each
# .exe and .msi using the service principal. Cert lives in Azure — never
# downloaded to the runner.

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.2, v1.1.0-beta.1
  workflow_dispatch:  # allow manual triggering for testing

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'  # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # Windows-only: install AzureSignTool so Tauri's signCommand can invoke it
      - name: Install AzureSignTool (Windows only)
        if: matrix.platform == 'windows-latest'
        run: dotnet tool install --global AzureSignTool

      # Bake Azure credentials into tauri.conf.json on the Windows runner.
      # We use the object-form signCommand (cmd + args array) so Tauri's
      # process spawn doesn't go through shell parsing — args are passed
      # to AzureSignTool literally. This avoids all the shell escaping
      # nonsense (backslashes eaten by shell_words, %VAR% not expanded,
      # cmd.exe not on PATH, etc).
      - name: Patch tauri.conf.json with Azure signing credentials (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows.signCommand = @{
            cmd = "AzureSignTool"
            args = @(
              "sign",
              "-kvu", $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
              "-kvc", $env:AZURE_TRUSTED_SIGNING_CERT_PROFILE,
              "-kvi", $env:AZURE_CLIENT_ID,
              "-kvs", $env:AZURE_CLIENT_SECRET,
              "-kvt", $env:AZURE_TENANT_ID,
              "-tr", "http://timestamp.acs.microsoft.com",
              "-td", "sha256",
              "-fd", "sha256",
              "-du", "https://projelli.com",
              "%1"
            )
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          Write-Host "Patched tauri.conf.json with Azure signing credentials"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing via Azure Trusted/Artifact Signing.
          # tauri.conf.json's bundle.windows.signCommand picks these up via
          # AzureSignTool which authenticates with the service principal and
          # signs each .exe / .msi. Cert lives in Azure — never on the runner.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Projelli ${{ github.ref_name }}'
          releaseBody: |
            Auto-generated release. See `CHANGELOG.md` for changes.

            ## Downloads
            - **Windows:** `.exe` installer (signed via Azure Artifact Signing)
            - **macOS Apple Silicon:** `.dmg` (signed + notarized by Apple)
            - **macOS Intel:** `.dmg` (signed + notarized by Apple)
            - **Linux:** `.AppImage` or `.deb`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
