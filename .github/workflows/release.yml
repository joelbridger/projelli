name: Release Tauri builds

# Triggered on tag push (e.g. `git tag v1.0.2 && git push --tags`).
# Builds Tauri installers for Windows, macOS (Intel + Apple Silicon), and Linux.
# Mac and Linux use tauri-action which builds + signs + uploads in one step.
# Windows is a separate job that builds unsigned, then signs via Microsoft's
# official azure/trusted-signing-action, then uploads via gh CLI.
#
# Why Windows is separate:
# Tauri 2's signCommand process spawn on Windows can't reliably find any
# executable we point it at — both bare names (PATH search broken) and
# absolute paths (CreateProcess errors) failed across 9 attempts. Microsoft's
# official action sidesteps this by signing the artifacts AFTER Tauri builds
# them.
#
# After the workflow finishes:
#   1. Go to https://github.com/keepance/keepance/releases
#   2. Find the draft release
#   3. Edit the description with the changelog from CHANGELOG.md
#   4. Click "Publish release"
#
# All required GitHub Secrets (set 2026-04-09):
#
#   macOS code signing + notarization:
#     APPLE_CERTIFICATE                base64-encoded .p12 of Developer ID Application cert
#     APPLE_CERTIFICATE_PASSWORD       password used when exporting the .p12
#     APPLE_SIGNING_IDENTITY           "Developer ID Application: Jameson Daines (7HCXDCS279)"
#     APPLE_ID                         jamesondaines@outlook.com
#     APPLE_PASSWORD                   app-specific password for notarization
#     APPLE_TEAM_ID                    7HCXDCS279
#
#   Windows code signing via Azure Trusted/Artifact Signing:
#     AZURE_TENANT_ID                  Entra tenant ID
#     AZURE_CLIENT_ID                  service principal app id (keepance-github-actions)
#     AZURE_CLIENT_SECRET              service principal client secret
#     AZURE_TRUSTED_SIGNING_ENDPOINT   region endpoint, e.g. https://eus.codesigning.azure.net/
#     AZURE_TRUSTED_SIGNING_ACCOUNT    artifact signing account name (keepance-signing)
#     AZURE_TRUSTED_SIGNING_CERT_PROFILE  certificate profile name (keepance-public-trust)

# Normal releases: push a tag (e.g. `git tag v1.0.2 && git push --tags`).
# Manual dispatch: now requires typing "release" in the confirm input — this
# prevents the 60-90 min signed multi-OS build from firing via a stray button
# click. The tag-push path is unaffected.
#
# TODO (Jameson — GitHub settings change): for stronger protection, create a
# GitHub Environment named "release-signing" on the keepance/keepance repo
# (Settings → Environments → New environment), add yourself as a required
# reviewer, then assign that environment to the `gate` job below. That forces
# a manual approval pop-up in the GitHub UI before any build runs, even on
# tag pushes. This requires a repo-settings change and cannot be done from a
# workflow file alone.
on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.2 — the NORMAL release path (deliberate tag push)
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm a SIGNED multi-OS build (~60-90 min + signing). Normal path is a tag push.'
        required: true
        default: ''

jobs:
  gate:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'release' }}
    name: Pre-release gate (must be green before any build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: i18n key parity
        run: npm run i18n:check
      - name: Unit tests + coverage floor
        run: npm run test:coverage
      - name: ESLint regression gate
        run: npm run lint:gate
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: protoc + webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - name: Stage sidecar stubs (tauri externalBin existence check)
        # The gate runs cargo test before the build jobs stage the real
        # sidecars; tauri validates externalBin paths before compiling, so
        # use tiny stubs here only.
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/piper-x86_64-unknown-linux-gnu
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/piper-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
      - name: Rust tests
        working-directory: ./src-tauri
        env: { CI: '1' }
        run: cargo test --workspace --locked

  # Mac + Linux jobs: tauri-action handles build + sign (Mac) + upload
  build:
    needs: gate
    permissions:
      contents: write
    env:
      # Gmail Desktop OAuth creds, injected at build time (kept out of source).
      KEEPANCE_GMAIL_CLIENT_ID: ${{ secrets.KEEPANCE_GMAIL_CLIENT_ID }}
      KEEPANCE_GMAIL_CLIENT_SECRET: ${{ secrets.KEEPANCE_GMAIL_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'  # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Required by lance-encoding's build.rs (prost-build). Added for v1.5
      # M1 (LanceDB RAG). Mac/Linux path.
      #
      # Switched FROM arduino/setup-protoc@v3 because that action queries
      # GitHub's protocolbuffers/protobuf releases API to resolve asset
      # URLs, and that endpoint has been returning empty arrays for
      # authenticated requests (the action passes GITHUB_TOKEN). Result:
      # "Error: unable to get latest version" failures across many runs.
      # Native package managers bypass the API entirely and ship a
      # working protoc on PATH within seconds.
      - name: Install protoc (Mac/Linux)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi
          protoc --version

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2

      - name: Install frontend dependencies
        run: npm ci

      # Phase 2 (v1.5) - stage the stub MCP sidecar binary so tauri build
      # can bundle it via externalBin. Phase 4 (M4) swaps the stub for a
      # real MCP server; the real implementation lands in src/mcp_bin/.
      #
      # Cargo builds keepance-mcp into
      # src-tauri/target/<target?>/release/keepance-mcp[.exe]. Tauri's
      # externalBin expects src-tauri/binaries/keepance-mcp-<target-triple>
      # so we copy + rename here. The externalBin array in
      # tauri.conf.json is still empty in Phase 2 - wiring it in Phase 4
      # will flip these builds from "nice to have" to "required".
      #
      # Phase 4 M6 voice sidecar: the `Fetch voice sidecar binary` step
      # below stages Parakeet.cpp (or whisper.cpp as fallback) into
      # `src-tauri/binaries/parakeet[.exe]`. Until a reliable per-platform
      # release artifact is pinned, the step is a no-op and voice features
      # are marked "binary required; see docs" in V1_5_RELEASE.md.
      #
      # Piper and llama.cpp are listed in tauri.conf.json externalBin, so
      # Tauri's build.rs validates presence on every cargo invocation. Stage
      # the real binaries and sibling runtime libraries BEFORE any cargo build.
      - name: Fetch local sidecars (Mac/Linux)
        shell: bash
        env:
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            TARGET="${MATRIX_ARGS##*--target }"
          else
            TARGET="x86_64-unknown-linux-gnu"
          fi
          FETCH_PIPER_VOICE=1 TARGET_TRIPLE="$TARGET" bash scripts/fetch-piper-sidecar.sh
          TARGET_TRIPLE="$TARGET" bash scripts/fetch-llama-sidecar.sh
          ls -la src-tauri/binaries/

      - name: Build Keepance MCP stub binary (Mac/Linux)
        shell: bash
        working-directory: src-tauri
        env:
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Matrix passes `--target aarch64-apple-darwin` or
            # `--target x86_64-apple-darwin` via MATRIX_ARGS. Extract it so
            # the cargo build uses the same target.
            TARGET="${MATRIX_ARGS##*--target }"
            rustup target add "$TARGET"
            cargo build --release --bin keepance-mcp --target "$TARGET"
            SRC="target/$TARGET/release/keepance-mcp"
          else
            # Linux: host triple, no cross compile.
            TARGET="$(rustc -vV | sed -n 's|host: ||p')"
            cargo build --release --bin keepance-mcp
            SRC="target/release/keepance-mcp"
          fi
          mkdir -p binaries
          cp "$SRC" "binaries/keepance-mcp-"
          echo "MCP_TARGET=$TARGET" >> "$GITHUB_ENV"
          ls -la binaries/

      # rc.11 (2026-04-27): Apple notarization rejects the .app if any
      # embedded binary isn't signed with the Developer ID cert + hardened
      # runtime + secure timestamp. Tauri's outer codesign call only signs
      # the top-level .app bundle; it does NOT recursively re-sign nested
      # binaries like the MCP sidecar in Contents/Resources/binaries/.
      # So we sign the MCP binary explicitly here, BEFORE tauri-action
      # bundles it into the .app. This step sets up its own temp keychain
      # so it can coexist with the keychain tauri-action creates later.
      - name: Sign MCP sidecar binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/keepance-mcp-sign.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/keepance-mcp-cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Add our keychain to the search list (don't replace user's, append).
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed -E 's/[[:space:]]*"([^"]+)"[[:space:]]*/\1 /g')
          # Sign every Mach-O file in binaries/ — including helper executables like
          # piper_phonemize that don't match a simple name pattern. Apple notarization
          # rejects the .app if ANY nested native binary is unsigned, so we detect by
          # file type rather than by name. Dylibs are Mach-O shared libraries and are
          # covered by the same check.
          while IFS= read -r -d '' BIN; do
            if file "$BIN" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" \
                "$BIN"
              codesign --verify --verbose=2 "$BIN"
              codesign -dvvv "$BIN" 2>&1 | grep -E "Authority|Timestamp|Runtime|flags" || true
            fi
          done < <(find binaries -maxdepth 1 -type f -print0)
          rm -f "$CERT_PATH"

      # Phase 4 M6 (v1.5 Flag 4) - Fetch the voice sidecar binary
      # (Parakeet.cpp or whisper.cpp) and stage it at
      # `src-tauri/binaries/parakeet[-<triple>]` so tauri build can bundle
      # it. The step is a no-op when the upstream release URL isn't
      # pinned yet; voice features are documented as "binary required".
      - name: Fetch voice sidecar binary (Mac/Linux)
        if: ${{ vars.VOICE_SIDECAR_URL != '' }}
        shell: bash
        working-directory: src-tauri
        env:
          VOICE_URL: ${{ vars.VOICE_SIDECAR_URL }}
        run: |
          set -euo pipefail
          mkdir -p binaries
          curl -fsSL "$VOICE_URL" -o /tmp/voice.tar.gz
          tar -xzf /tmp/voice.tar.gz -C /tmp
          # Expected layout: /tmp/<name>/parakeet (or whisper). Find and copy.
          BIN="$(find /tmp -maxdepth 3 -type f \( -name parakeet -o -name whisper \) | head -1)"
          if [[ -n "$BIN" ]]; then
            cp "$BIN" "binaries/$(basename "$BIN")"
            chmod +x "binaries/$(basename "$BIN")"
            ls -la binaries/
          else
            echo "No voice sidecar binary found in archive; skipping"
          fi

      # Phase 4 M4 (v1.5 Flag 2) - Bundle the keepance-mcp binary into a
      # `.mcpb` Desktop Extension archive. Claude Desktop installs these
      # with a double-click; other MCP clients can unpack and register the
      # binary directly. One archive per platform so the download stays
      # lean for the user (no fat-binary tradeoff).
      - name: Build .mcpb bundle (Mac/Linux)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${MCP_TARGET}"
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p mcpb-dist
          node scripts/build-mcpb.mjs \
            --binary "src-tauri/binaries/keepance-mcp-" \
            --target "$TARGET" \
            --output "mcpb-dist/keepance-.mcpb" \
            --version "$VERSION"
          ls -la mcpb-dist/

      - name: Build Tauri app (Mac/Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy is itself an AppImage; on the GitHub ubuntu runners it
          # can stall then fail to mount via FUSE during AppImage bundling
          # (deb/rpm bundle fine, only the appimage step hangs ~49 min then
          # errors "failed to run linuxdeploy"). Extract-and-run avoids the FUSE
          # mount; NO_STRIP skips the flaky strip pass. Both no-op on macOS.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          # macOS signing + notarization. Apple's notary service was
          # unreliable for several weeks in spring 2026 (submissions stuck
          # "In Progress" for 8-24+ hours), which is why the three
          # notarization env vars were originally commented out.
          # Re-enabled in rc.11 (2026-04-27) to probe whether the service
          # has recovered. If a notarized build ships clean, this stays on.
          # If submissions stall again, comment the three APPLE_ID /
          # APPLE_PASSWORD / APPLE_TEAM_ID lines back out and ship the
          # signed-but-unnotarized fallback (Gatekeeper "Open Anyway" UX).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing. tauri-action signs the bundle artifacts with
          # the minisign keypair embedded in tauri.conf.json (pubkey) and
          # this private key (secret). Without these vars the build still
          # runs but no .sig files are produced and latest.json won't be
          # generated.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Keepance ${{ github.ref_name }}'
          releaseBody: |
            Auto-generated release. See `CHANGELOG.md` for changes.

            ## Downloads
            - **Windows:** `.exe` installer (signed via Azure Artifact Signing)
            - **macOS Apple Silicon:** `.dmg` (signed with Developer ID + notarized by Apple — opens cleanly with no Gatekeeper warning)
            - **macOS Intel:** `.dmg` (signed with Developer ID + notarized by Apple — opens cleanly with no Gatekeeper warning)
            - **Linux:** `.AppImage` or `.deb`
            - **MCP bundle: `keepance-<platform>.mcpb`` (install into Claude Desktop)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Phase 4 M4 (v1.5 Flag 2) - Upload the `.mcpb` bundle alongside the
      # installers. We use gh CLI rather than tauri-action's own upload
      # because tauri-action only uploads files under the `bundle/` dir and
      # the .mcpb lives outside that tree. `--clobber` lets re-runs replace
      # the previous artifact without deleting the draft.
      - name: Upload .mcpb to release (Mac/Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          TARGET="${MCP_TARGET}"
          gh release upload "$TAG" \
            "mcpb-dist/keepance-.mcpb" \
            --clobber --repo keepance/keepance

  # Windows job: separate from the matrix because we don't use Tauri's
  # signCommand. Build with raw npm + sign with Microsoft's official action
  # + upload via gh CLI.
  build-windows:
    needs: gate
    permissions:
      contents: write
    env:
      # Gmail Desktop OAuth creds, injected at build time (kept out of source).
      KEEPANCE_GMAIL_CLIENT_ID: ${{ secrets.KEEPANCE_GMAIL_CLIENT_ID }}
      KEEPANCE_GMAIL_CLIENT_SECRET: ${{ secrets.KEEPANCE_GMAIL_CLIENT_SECRET }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Required by lance-encoding's build.rs (prost-build). Added for v1.5
      # M1 (LanceDB RAG). Windows path.
      #
      # Switched FROM arduino/setup-protoc@v3 for the same reason as the
      # Mac/Linux path above. Chocolatey is preinstalled on the
      # windows-latest runners and ships protoc on PATH.
      - name: Install protoc (Windows)
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Install frontend dependencies
        run: npm ci

      # Piper and llama.cpp are listed in tauri.conf.json externalBin, so
      # Tauri's build.rs validates presence on every cargo invocation. Stage
      # the real Windows binaries and sibling DLLs BEFORE any cargo build.
      - name: Fetch local sidecars (Windows)
        shell: bash
        run: |
          set -euo pipefail
          FETCH_PIPER_VOICE=1 TARGET_TRIPLE=x86_64-pc-windows-msvc bash scripts/fetch-piper-sidecar.sh
          TARGET_TRIPLE=x86_64-pc-windows-msvc bash scripts/fetch-llama-sidecar.sh
          ls -la src-tauri/binaries/

      # Phase 2 (v1.5) - stage the stub MCP sidecar binary. See the Mac/Linux
      # job above for rationale. Windows uses the MSVC host triple.
      - name: Build Keepance MCP stub binary (Windows)
        shell: pwsh
        working-directory: src-tauri
        run: |
          $host_triple = (& rustc -vV | Select-String '^host: ').ToString().Replace('host: ','').Trim()
          cargo build --release --bin keepance-mcp
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          Copy-Item "target/release/keepance-mcp.exe" "binaries/keepance-mcp-$host_triple.exe"
          "MCP_TARGET=$host_triple" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem binaries

      # Phase 4 M6 (v1.5 Flag 4) - Fetch Windows voice sidecar binary
      # when pinned via the VOICE_SIDECAR_URL repo variable.
      - name: Fetch voice sidecar binary (Windows)
        if: ${{ vars.VOICE_SIDECAR_URL != '' }}
        shell: pwsh
        working-directory: src-tauri
        env:
          VOICE_URL: ${{ vars.VOICE_SIDECAR_URL }}
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          Invoke-WebRequest -Uri $env:VOICE_URL -OutFile "$env:TEMP\voice.zip"
          Expand-Archive -Path "$env:TEMP\voice.zip" -DestinationPath "$env:TEMP\voice-sidecar"
          $bin = Get-ChildItem -Path "$env:TEMP\voice-sidecar" -Recurse -Include 'parakeet.exe','whisper.exe' | Select-Object -First 1
          if ($bin) {
            Copy-Item $bin.FullName "binaries/$($bin.Name)"
            Get-ChildItem binaries
          } else {
            Write-Host 'No voice sidecar binary found in archive; skipping'
          }

      # Phase 4 M4 (v1.5 Flag 2) - Bundle the Windows keepance-mcp binary
      # into a `.mcpb` archive. See the Mac/Linux block above for rationale.
      - name: Build .mcpb bundle (Windows)
        shell: pwsh
        run: |
          $target = $env:MCP_TARGET
          $version = (node -p "require('./package.json').version")
          New-Item -ItemType Directory -Force -Path mcpb-dist | Out-Null
          node scripts/build-mcpb.mjs `
            --binary "src-tauri/binaries/keepance-mcp-${target}.exe" `
            --target $target `
            --output "mcpb-dist/keepance-.mcpb" `
            --version $version
          Get-ChildItem mcpb-dist

      - name: Build Tauri app (unsigned)
        env:
          # Updater signing also needed on the Windows job so the NSIS
          # installer .sig file is produced. Without it, Windows users
          # can't auto-update because the manifest would have no signature
          # for them to verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== NSIS bundles ==="
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Recurse -ErrorAction SilentlyContinue | Format-Table FullName,Length
          Write-Host "=== MSI bundles ==="
          Get-ChildItem -Path src-tauri/target/release/bundle/msi -Recurse -ErrorAction SilentlyContinue | Format-Table FullName,Length
          Write-Host "=== standalone binary ==="
          Get-ChildItem -Path src-tauri/target/release/keepance.exe -ErrorAction SilentlyContinue | Format-Table FullName,Length

      # v1.6 W-PX: stage the portable .exe.
      # Tauri produces target/release/keepance.exe as the native app binary
      # before NSIS wraps it into an installer. That same exe IS the portable
      # version, we just rename it + sign it + upload it alongside the
      # installer. Data still lives in %APPDATA%\Keepance (true portable
      # data dir requires Rust refactor; v1.7).
      - name: Copy portable Windows .exe
        shell: pwsh
        working-directory: src-tauri
        run: |
          $version = (node -p "require('../package.json').version")
          $portableDir = "target/release/portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target/release/keepance.exe" "$portableDir/Keepance__x64-portable.exe"
          Get-ChildItem $portableDir | Format-Table Name,Length

      # azure/trusted-signing-action installs the TrustedSigning PowerShell
      # module from PSGallery. Recent windows-latest runner images ship without
      # PSGallery registered, so that install fails with "Unable to find
      # repository 'PSGallery'" (v2.4.1 signed fine 2026-06-06; v2.5.0 failed
      # 2026-06-08 with exactly this). Register PSGallery + the NuGet provider and
      # pre-install the exact module version the action needs, before it runs.
      - name: Ensure PSGallery + TrustedSigning module are available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Write-Host "pwsh $($PSVersionTable.PSVersion)"
          # Bootstrap the NuGet provider from Microsoft's provider endpoint. This does
          # NOT need a registered repository (Install-PackageProvider DOES, which is why
          # it failed with "No match was found for the provider 'NuGet'").
          Get-PackageProvider -Name NuGet -ForceBootstrap | Out-Null
          # Register + trust PSGallery for PowerShellGet v2. The signing action runs
          # `Install-Module -Repository PSGallery` in pwsh, and recent windows-latest
          # images ship without PSGallery registered.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Canary: mirror the signing action's exact call. If this succeeds, so will it.
          Install-Module -Name TrustedSigning -RequiredVersion 0.5.3 -Force -Scope CurrentUser -Repository PSGallery
          Get-InstalledModule -Name TrustedSigning | Format-Table Name,Version

      - name: Sign Windows artifacts with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # v1.6 W-PX: sign the portable .exe with the same Azure cert as the
      # installer. Separate signing step because Azure's action scopes by
      # folder; the portable lives in target/release/portable, not under
      # bundle/.
      - name: Sign portable Windows .exe with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: src-tauri/target/release/portable
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Auto-update fix: the updater `.sig` produced during `tauri build` signs the
      # UNSIGNED installer. Azure Trusted Signing then rewrites the .exe bytes, so
      # that .sig no longer matches what users download and the Tauri updater would
      # reject the update as tampered. Re-generate the updater signature over the
      # FINAL (Azure-signed) installer so latest.json carries a valid signature.
      # tauri signer sign reads the key from TAURI_PRIVATE_KEY / *_PASSWORD env.
      - name: Regenerate updater signature on the signed installer
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No NSIS -setup.exe found to re-sign" }
          Write-Host "Re-signing updater artifact for $($exe.FullName)"
          npx tauri signer sign "$($exe.FullName)"
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "Updater .sig was not produced next to the installer" }
          Write-Host "Regenerated updater signature:"
          Get-Content "$($exe.FullName).sig"

      - name: Wait for tauri-action to create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tauri-action job (Mac/Linux) creates the draft release on first
          # successful upload. We poll for up to 30 minutes for it to exist.
          $tag = "${{ github.ref_name }}"
          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $exists = gh release view $tag --repo keepance/keepance 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Draft release exists for $tag"
              break
            }
            $attempt++
            Write-Host "Waiting for draft release... attempt $attempt/$maxAttempts"
            Start-Sleep -Seconds 30
          }
          if ($attempt -eq $maxAttempts) {
            Write-Host "Draft release didn't appear in time. Creating it ourselves."
            gh release create $tag --draft --title "Keepance $tag" --notes "Auto-generated release. See CHANGELOG.md for changes." --repo keepance/keepance
          }

      - name: Upload signed Windows artifacts to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @()
          $files += Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -Recurse -ErrorAction SilentlyContinue
          # v1.6 W-PX: include the signed portable .exe in the upload list.
          $files += Get-ChildItem -Path src-tauri/target/release/portable -Filter *.exe -ErrorAction SilentlyContinue
          # Auto-update: include the regenerated NSIS updater signature so the
          # finalize-updater-manifest job can publish it in latest.json.
          $files += Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe.sig -Recurse -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
            Write-Error "No signed artifacts found to upload"
            exit 1
          }
          foreach ($f in $files) {
            Write-Host "Uploading $($f.FullName) to release $tag"
            gh release upload $tag $f.FullName --clobber --repo keepance/keepance
          }

      # Phase 4 M4 (v1.5 Flag 2) - Upload the Windows `.mcpb` bundle.
      - name: Upload .mcpb to release (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $target = $env:MCP_TARGET
          $mcpb = "mcpb-dist/keepance-.mcpb"
          if (-not (Test-Path $mcpb)) {
            Write-Error "No .mcpb bundle found at $mcpb"
            exit 1
          }
          Write-Host "Uploading $mcpb to release $tag"
          gh release upload $tag $mcpb --clobber --repo keepance/keepance

  # Auto-update: the Mac/Linux `build` job writes latest.json but only for its own
  # platforms; build-windows uploads the Azure-signed installer plus its
  # regenerated updater `.sig`. This job runs AFTER both complete and merges a
  # windows-x86_64 entry into latest.json so existing Windows users auto-update.
  finalize-updater-manifest:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge Windows into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p manifest && cd manifest
          gh release download "$TAG" --repo keepance/keepance \
            --pattern 'latest.json' --pattern '*-setup.exe.sig' --clobber
          SIGFILE="$(ls *-setup.exe.sig)"
          EXE="${SIGFILE%.sig}"
          SIG="$(cat "$SIGFILE")"
          URL="https://github.com/keepance/keepance/releases/download/${TAG}/${EXE}"
          echo "Windows installer asset: $EXE"
          jq --arg sig "$SIG" --arg url "$URL" \
            '.platforms["windows-x86_64"] = {signature: $sig, url: $url}' \
            latest.json > latest.merged.json
          mv latest.merged.json latest.json
          echo "Merged platform keys:"; jq -r '.platforms | keys[]' latest.json
          gh release upload "$TAG" latest.json --clobber --repo keepance/keepance
