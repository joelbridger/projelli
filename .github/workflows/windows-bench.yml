name: Windows Bench (robot smoke)

# Runs the test robot's end-to-end smoke against the Keepance desktop app on a
# self-hosted Windows runner (the Legion). The robot drives the app over the
# WebView2 CDP port (localhost:9223), so the job only needs local network access
# to that port — no GUI rendering in the job itself.
#
# This job is SELF-SUFFICIENT: it does not assume the app (or even Windows'
# power state) is already correct. It (1) sets the Legion to never sleep,
# (2) syncs the checked-out tip into the dev app directory so the smoke
# always tests current code — not whatever was last hand-deployed, (3) starts
# the app ONLY if it isn't already reachable (cli.mjs reset needs an
# already-connectable CDP target to attach Playwright to — it can't cold-
# start the app itself), (4) brings the bench to a clean, fully-indexed,
# frozen-snapshot state via the robot's own `reset(mode:'snapshot')` — the
# SAME kill+restore+restart+wait+seed sequence the smoke would otherwise
# redundantly repeat on top of step 3's boot. The app's ~300-file PDF-index
# pass re-runs on every boot, so an unconditional restart in step 3 would
# double the run every time (see the 2026-07-02 timeout postmortem this
# restructuring fixed) — skipping it when already up means the common case
# (nothing else kills the app between daily runs) pays for indexing only
# once, in step 4. ROBOT_SMOKE_FAST=1 then tells the smoke to skip its own
# reset's kill/restart (mode:'fast': purge + reseed + reload only), since
# step 4 already did the heavy lifting. On failure it writes a job-summary so
# a red run is loud, never silent.
#
# Manual trigger: gh workflow run windows-bench.yml

on:
  workflow_dispatch:
  schedule:
    # Nightly hands-free real-app Windows smoke (~02:00 Mountain). Manual: gh workflow run.
    - cron: '0 9 * * *'

concurrency:
  group: windows-bench
  cancel-in-progress: false

jobs:
  robot-smoke:
    runs-on: [self-hosted, windows-bench]
    # Generous budget: a cold Rust rebuild (Legion idle a long time) can take
    # ~20 min, and the demo's ~300-file PDF-indexing pass re-runs from scratch
    # on every app boot (a real app characteristic, not a fluke) — this job
    # boots the app exactly ONCE (see the restructuring note above), so the
    # worst case is one cold build + one full ~20-30 min indexing pass. Most
    # runs finish far sooner (subsequent-day runs / an already-warm bench).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Keep the Legion awake (insurance against the runner going offline again)
        shell: pwsh
        run: |
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          Write-Output "Power policy set: never sleep/hibernate/monitor-off on AC."

      - name: Sync current tip into C:\keepance (the dev app the robot drives)
        shell: pwsh
        run: |
          $src = $env:GITHUB_WORKSPACE
          $dst = "C:\keepance"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $lockChanged = $true
          if (Test-Path "$dst\package-lock.json") {
            $oldHash = (Get-FileHash "$dst\package-lock.json" -Algorithm SHA256).Hash
            $newHash = (Get-FileHash "$src\package-lock.json" -Algorithm SHA256).Hash
            $lockChanged = ($oldHash -ne $newHash)
          }

          # Additive sync only (no /MIR): never delete bench-local files we don't
          # track here (e.g. anything hand-placed on the Legion outside the repo).
          # `scripts/` IS synced — `npm run dev`'s predev hook
          # (scripts/copy-build-assets.mjs) needs current code to boot the app at
          # all. Bare-name excludes only — robocopy silently ignores nested-path excludes.
          robocopy $src $dst /E /XD node_modules target dist dist-node binaries voices .git /NFL /NDL /NJH /NJS /R:2 /W:5
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -ge 8) { Write-Error "robocopy failed (exit $robocopyExit)"; exit 1 }
          # robocopy returns 0-7 on success (nonzero = "files were copied", not an
          # error) — clear it so pwsh doesn't treat this step as failed.
          $global:LASTEXITCODE = 0
          Write-Output "synced tip -> C:\keepance (dependency lockfile changed: $lockChanged)"

          if ($lockChanged) {
            Write-Output "package-lock.json changed — running npm install"
            Push-Location $dst
            # --ignore-scripts: C:\keepance is a plain file mirror, not a git
            # checkout, so the "prepare" lifecycle script (install-git-hooks.sh,
            # which assumes .git exists) would fail here. We only need deps.
            npm install --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -ne 0) { Write-Error "npm install failed"; Pop-Location; exit 1 }
            Pop-Location
          }
          exit 0

      - name: Install Playwright package (no browser download — playwright.mjs connects over CDP)
        run: npm install --no-audit --no-fund --no-save playwright

      - name: Ensure the app is reachable (start it ONLY if it isn't already)
        shell: pwsh
        run: |
          # cli.mjs reset needs an ALREADY-connectable CDP target to attach
          # Playwright to before it can run its own kill+restore+restart —
          # it can't cold-start the app itself. Skipping the restart when the
          # app is already up (the common case — nothing else kills it
          # between daily runs) means the ~300-file PDF-index pass that
          # re-runs on every boot only pays once (in the next step) instead
          # of twice; only a genuinely cold Legion pays for two.
          $cdp = 0
          try { $cdp = (Invoke-WebRequest 'http://127.0.0.1:9223/json/version' -UseBasicParsing -TimeoutSec 4).StatusCode } catch {}
          if ($cdp -eq 200) { Write-Output "app already reachable on CDP 9223 — skipping restart"; exit 0 }

          Write-Output "app not reachable — starting it"
          Stop-Process -Name node,cargo,lantern,msedgewebview2 -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 6
          Start-ScheduledTask -TaskName KeepanceDev

          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 10
            $cdp = 0
            try { $cdp = (Invoke-WebRequest 'http://127.0.0.1:9223/json/version' -UseBasicParsing -TimeoutSec 4).StatusCode } catch {}
            $vite4 = 0
            try { $vite4 = (Invoke-WebRequest 'http://127.0.0.1:5173/' -UseBasicParsing -TimeoutSec 4).StatusCode } catch {}
            $vite6 = 0
            try { $vite6 = (Invoke-WebRequest 'http://[::1]:5173/' -UseBasicParsing -TimeoutSec 4).StatusCode } catch {}
            Write-Output "poll ${i}: cdp=$cdp vite4=$vite4 vite6=$vite6"
            if ($cdp -eq 200 -and ($vite4 -eq 200 -or $vite6 -eq 200)) { $ok = $true; break }
          }
          if (-not $ok) {
            Write-Error "App never came up on CDP 9223 / Vite 5173 on either IPv4 or IPv6 localhost within budget."
            Get-Content C:\tauri-dev.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Output "app up: CDP 9223 + Vite 5173"

      - name: Bring the bench to a clean, frozen-snapshot state (kill + restore + restart + seed)
        shell: pwsh
        env:
          ROBOT_LOCAL: '1'
          DESKTOP_CDP_PORT: '9223'
        run: |
          node scripts/robot/cli.mjs reset '{"mode":"snapshot"}' --no-daemon
          if ($LASTEXITCODE -ne 0) {
            Write-Error "bench reset (snapshot restore) failed — see output above."
            Get-Content C:\tauri-dev.log -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Run the robot smoke (Windows-native, drives the live app over CDP)
        shell: pwsh
        env:
          ROBOT_LOCAL: '1'
          DESKTOP_CDP_PORT: '9223'
          # The previous step already did the kill+restore+restart+seed cycle
          # (mode:'snapshot') — ROBOT_SMOKE_FAST makes the smoke's own reset
          # step 'fast' (purge+reseed+reload, no app kill/restart), so the
          # ~300-file PDF-index pass that re-runs on every boot only pays once
          # per run instead of twice.
          ROBOT_SMOKE_FAST: '1'
        run: node scripts/robot/smoke.mjs

      - name: Failure summary (make a red run loud, never silent)
        if: failure()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## :x: Windows Bench smoke FAILED"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Check the failing step's log above. Common causes: the app never reached CDP 9223 / Vite 5173 (see \`C:\tauri-dev.log\`), a robot verb assertion failed (real product bug), or the Legion went offline again (self-hosted runner status: \`gh api repos/keepance/keepance/actions/runners\`)."
