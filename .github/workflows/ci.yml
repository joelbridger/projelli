name: CI

# Runs on every pull request and every push to master or keepance-3.0.
# Catches TypeScript errors, i18n key drift, ESLint regressions, and Rust
# test failures before they land.
#
# ESLint: uses scripts/eslint-gate.mjs + .eslint-baseline.json to enforce
# "no new errors/warnings vs the committed baseline" (currently 1326 errors /
# 328 warnings of pre-existing issues). The gate fails only if a change ADDS
# new problems — it does not require fixing the existing baseline.

on:
  pull_request:
  push:
    branches:
      - master
      - keepance-3.0

# Cancel superseded in-progress runs on the same ref (e.g. rapid PR pushes); never
# cancel a push to the long-lived branches mid-run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: i18n key parity (report-only — KNOWN-I18N-01 deferred)
        # i18n is a deferred decision (KNOWN-I18N-01): the locale files carry
        # pre-existing key drift. Report it but DON'T block CI until i18n is
        # properly addressed. Re-make this a hard gate (drop the `|| echo`) once
        # the drift is fixed — do NOT "fix" it with i18n:extract (destructive:
        # it rewrites locale files and wipes existing es/de translations).
        run: npm run i18n:check || echo "::warning::i18n key drift (KNOWN-I18N-01, deferred) — not blocking"

      - name: ESLint regression gate (fails only on NEW errors/warnings)
        run: npm run lint:gate

      - name: Frontend unit tests + coverage floor (src/** only; Rust coverage is separate)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install backend deps
        working-directory: ./backend
        run: bun install --frozen-lockfile
      - name: Backend typecheck
        working-directory: ./backend
        run: bun run typecheck
      - name: Backend tests
        working-directory: ./backend
        run: bun test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install Linux/webkit deps
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - name: Stage Piper sidecar stub (tauri externalBin existence check)
        # tauri's build validates bundle.externalBin (binaries/piper) BEFORE
        # compiling tests; on a clean runner binaries/ has only .gitkeep, so a
        # stub file must exist or cargo test fails. Tests never execute it.
        run: |
          protoc --version
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/piper-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/piper-x86_64-unknown-linux-gnu
      - name: cargo test (hermetic; ignored/live/stress tests excluded by default)
        working-directory: ./src-tauri
        env:
          CI: '1'
        run: cargo test --workspace --locked

  e2e:
    # Browser E2E gatekeeper (2026-06-24 testing strategy): build the production-like
    # preview bundle and run the Playwright suite (chromium project) against it, so a
    # change that breaks a screen is caught HERE, before the slow real-Windows bench.
    # AI is offline — the one live-network test is skipped via E2E_NO_LIVE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright (chromium + OS deps)
        run: npx playwright install --with-deps chromium
      - name: Build E2E preview bundle
        run: npx vite build --config vite.config.e2e.ts
      - name: Run browser E2E gate (chromium, offline AI, CI-stable subset)
        env:
          E2E_NO_LIVE: '1'
          # Quarantine the 12 CI-environment-sensitive specs (see playwright.config.ts)
          # so the gate is a trustworthy green hard-gate. They run locally + nightly.
          E2E_CI_QUARANTINE: '1'
        run: |
          npx vite preview --config vite.config.e2e.ts --port 4173 --strictPort >/tmp/e2e-preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173 >/dev/null 2>&1 && break; sleep 1; done
          E2E_BASE_URL=http://localhost:4173 npx playwright test --project=chromium --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
