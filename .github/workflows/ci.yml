name: CI

# Runs on every pull request and every push to master, keepance-3.0, or lantern-plus.
# Catches TypeScript errors, i18n key drift, ESLint regressions, and Rust
# test failures before they land.
#
# ESLint: uses scripts/eslint-gate.mjs + .eslint-baseline.json to enforce
# "no new errors/warnings vs the committed baseline" (currently 1326 errors /
# 328 warnings of pre-existing issues). The gate fails only if a change ADDS
# new problems — it does not require fixing the existing baseline.

on:
  pull_request:
  push:
    branches:
      - master
      - keepance-3.0
      - lantern-plus

# Cancel superseded in-progress runs on the same ref (e.g. rapid PR pushes); never
# cancel a push to the long-lived branches mid-run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Install node_modules once and cache them. Both the `quality` and `e2e`
  # jobs depend on this job and restore from the same cache key, so npm ci
  # runs at most once per unique package-lock.json hash per OS.
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore node_modules cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss only)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

  quality:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Tauri version parity (npm vs Cargo, app version strings)
        # Fast static check from scripts/gate.sh — catches the exact drift that
        # made it all the way to the v3.3.5-rc.2 release build before this was
        # wired into CI. See scripts/check-tauri-parity.mjs for background.
        run: node scripts/check-tauri-parity.mjs

      - name: Tauri command contracts (TypeScript invokes match Rust commands)
        run: node scripts/check-tauri-contracts.mjs

      - name: Brand sync check (generated files match brand.config.json)
        run: npm run brand:check

      - name: Identity check (identity SoT modules export required constants)
        run: npm run identity:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: TypeScript check (tests)
        run: npm run typecheck:tests

      - name: Wire-contract gate
        # Dormant only until an Intake wire lands on this branch; after that,
        # test:contracts fails closed if the canonical real round trip is gone.
        run: npm run test:contracts

      - name: i18n key parity (report-only — KNOWN-I18N-01 deferred)
        # i18n is a deferred decision (KNOWN-I18N-01): the locale files carry
        # pre-existing key drift. Report it but DON'T block CI until i18n is
        # properly addressed. Re-make this a hard gate (drop the `|| echo`) once
        # the drift is fixed — do NOT "fix" it with i18n:extract (destructive:
        # it rewrites locale files and wipes existing es/de translations).
        run: npm run i18n:check || echo "::warning::i18n key drift (KNOWN-I18N-01, deferred) — not blocking"

      - name: ESLint regression gate (fails only on NEW errors/warnings)
        run: npm run lint:gate

      - name: Frontend unit tests + coverage floor (src/** only; Rust coverage is separate)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  # The CANONICAL backend gate — one script, six steps, no subset.
  #
  # This job used to run `bun run typecheck` + `bun test` only. The two
  # structural guards (the request-body totality boundary and the privileged
  # route registry) ran exclusively in `scripts/gate.sh`, which CI never calls,
  # so a PR that reintroduced an unbounded body drain — or removed `auth` from a
  # privileged route — faced neither of them and landed GREEN. A checker nobody
  # runs is indistinguishable from absent. `npm run backend:gate` runs all six
  # steps in one place so they cannot drift into disjoint green paths again.
  backend:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install backend deps
        working-directory: ./backend
        run: bun install --frozen-lockfile
      # Repo ROOT, not ./backend — the script cd's into backend itself for the
      # typecheck and test steps.
      - name: Canonical backend gate (structural guards + typecheck + tests)
        run: npm run backend:gate

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install Linux/webkit deps
        # libasound2-dev: cpal (Lantern-Plus Wave 3a meeting capture) links
        # alsa-sys on Linux, which needs ALSA's pkg-config file (alsa.pc) to
        # build — without it, compiling the capture crate fails before any
        # test runs (codex-review round 16 caught this: WebKit deps alone
        # don't pull ALSA in as a transitive dependency).
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 libasound2-dev
      - name: Stage sidecar stubs (tauri externalBin existence check)
        # tauri's build validates bundle.externalBin (binaries/piper AND
        # binaries/llama-server) BEFORE compiling tests; on a clean runner
        # binaries/ has only .gitkeep, so both stub files must exist or cargo
        # test fails build.rs with "resource path ... doesn't exist". Tests
        # never execute them. Mirrors the release.yml gate's stub step.
        run: |
          protoc --version
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/piper-x86_64-unknown-linux-gnu
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/piper-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/llama-server-x86_64-unknown-linux-gnu
      - name: cargo test (hermetic; ignored/live/stress tests excluded by default)
        working-directory: ./src-tauri
        env:
          CI: '1'
        run: cargo test --workspace --locked

  cargo-deny:
    # License + supply-chain gate. Fails the PR if a dependency introduces a
    # disallowed license (e.g. strong copyleft like GPL/AGPL, which is unsafe to
    # ship in this proprietary app), a known RUSTSEC security advisory, a yanked
    # crate, or a source outside crates.io. The full policy and the reasoning
    # behind every allowance/exception live in src-tauri/deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny shells out to `cargo metadata`, so a toolchain must be on
      # PATH. ubuntu-latest ships one, but install it explicitly (as the `rust`
      # job does) so the gate doesn't depend on the runner image. No compiling
      # happens here — cargo-deny only reads Cargo.toml/Cargo.lock metadata.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny (prebuilt binary — no compile)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny check (advisories, licenses, sources, bans)
        working-directory: ./src-tauri
        run: cargo deny check advisories licenses sources bans

  e2e:
    # Browser E2E gatekeeper (2026-06-24 testing strategy): build the production-like
    # preview bundle and run the Playwright suite (chromium project) against it, so a
    # change that breaks a screen is caught HERE, before the slow real-Windows bench.
    # AI is offline — the one live-network test is skipped via E2E_NO_LIVE.
    #
    # SHARDED (2026-07-01, F1.3): a single unsharded `playwright test` invocation
    # against this many specs reliably fails a large tail of otherwise-passing tests
    # from long-run resource pressure — the exact mechanism scripts/run-e2e-suite.sh
    # documents and works around locally (see docs/quality/e2e-suite-batching.md).
    # That's why this job had been red on effectively every push. Splitting into N
    # parallel shards, each a short run on its own fresh runner, removes the
    # long-single-run pressure entirely (mirrors the local sharded script) and is
    # faster than one long serial run.
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium + OS deps)
        run: npx playwright install --with-deps chromium
      - name: Build E2E preview bundle
        run: npx vite build --config vite.config.e2e.ts
      - name: Build + merge web-demo bundle (web-demo.spec.ts needs the real /try build)
        # F3.7b (2026-07-03): web-demo.spec.ts drives /index.demo.html, which under
        # `vite dev` Vite serves directly from source (any *.html at the project
        # root). The e2e job instead serves a production `vite build`, and the
        # BASE config's `rollupOptions` has no `input` override — it defaults to
        # `index.html` only — so `dist/` never contained `index.demo.html` at all
        # (a 404, not merely a missing `__KEEPANCE_DEMO__` define). Build the
        # dedicated web-demo bundle (the one that actually sets
        # `__KEEPANCE_DEMO__`/`__KEEPANCE_DESKTOP__`, same as the real
        # keepance.com/try deploy) into its own `dist-web-demo/` output, then copy
        # it into the already-built `dist/` so ONE preview server can serve both
        # the desktop entry and the demo entry side by side:
        #   dist/index.demo.html        (renamed from dist-web-demo/index.demo.html)
        #   dist/try/assets/*           (the demo bundle's `base: '/try/'` assets)
        run: |
          npx vite build --config vite.config.web-demo.ts
          mkdir -p dist/try
          cp -r dist-web-demo/assets dist/try/assets
          cp dist-web-demo/index.demo.html dist/index.demo.html
      - name: Run browser E2E gate (chromium, offline AI, CI-stable subset, shard ${{ matrix.shard }}/6)
        env:
          E2E_NO_LIVE: '1'
          # Quarantine the CI-environment-sensitive specs (see playwright.config.ts)
          # so the gate is a trustworthy green hard-gate. They run locally + nightly.
          E2E_CI_QUARANTINE: '1'
        run: |
          npx vite preview --config vite.config.e2e.ts --port 4173 --strictPort >/tmp/e2e-preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173 >/dev/null 2>&1 && break; sleep 1; done
          E2E_BASE_URL=http://localhost:4173 npx playwright test --project=chromium --shard=${{ matrix.shard }}/6 --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
