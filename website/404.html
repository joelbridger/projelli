<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Advisor Prep Hero</title>
  <style>
    :root { --navy: #0A2540; --blue: #5DC6FF; --pink: #FF5F9E; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: #fff; text-decoration: none; opacity: 0.9; }
    .code {
      font-size: 84px; font-weight: 800; line-height: 1; margin: 28px 0 8px;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; color: rgba(255,255,255,0.72); margin-bottom: 28px; }
    .cta {
      display: inline-block; padding: 13px 26px; border-radius: 8px; font-weight: 700; font-size: 15px;
      text-decoration: none; color: #0A2540; background: linear-gradient(135deg, var(--pink), var(--blue));
    }
    .cta:hover { filter: brightness(1.08); }
    .links { margin-top: 28px; font-size: 14px; }
    .links a { color: var(--blue); text-decoration: none; margin: 0 10px; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="https://advisorprephero.com/">Advisor Prep Hero</a>

    <p>The page you're looking for moved or was never here. Your files, of course, are still safe on your own machine.</p>
    <a class="cta" href="https://advisorprephero.com/">Back to home</a>
    <div class="links">
      <a href="https://advisorprephero.com/legal/">Attorneys</a>
      <a href="https://advisorprephero.com/tax/">Tax pros</a>
      <a href="https://advisorprephero.com/consulting/">Consultants</a>

</body>
</html>
