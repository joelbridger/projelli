[package]
name = "matter-retrieval"
version = "0.0.0"
edition = "2021"
publish = false
description = "DE-RISKING SPIKE: prove matter-scoped, exact-source cited retrieval over a mixed doc+email corpus (Keepance 3.0, P0 gate 2)."

# Standalone spike crate, deliberately NOT wired into the Tauri build so
# `cargo test` here is fast and isolated. It exercises the SAME LanceDB +
# fastembed path the real app uses (see src-tauri/src/commands/rag/), with one
# addition: a `matter_id` column written at index time and an `only_if` filter
# applied at query time. The proven design is intended to extend the real
# rag store + Hit + rag_retrieve API.
#
# Versions are pinned to MATCH src-tauri/Cargo.toml exactly so what we prove
# here is what ships:
#   lancedb 0.21, fastembed 4, arrow-array/arrow-schema 55.

[dependencies]
# Vector store — same crate/version the app uses. We add a `matter_id` Utf8
# column to the chunk schema and filter on it with `QueryBase::only_if`.
lancedb = "0.21"
# Local ONNX embeddings (intfloat/multilingual-e5-small, 384-dim) — identical
# model + prefixes ("query: " / "passage: ") to the app's embedder.
fastembed = "4"
# Arrow arrays/schema — pinned to lancedb 0.21's transitive arrow (55).
arrow-array = "55"
arrow-schema = "55"
# Async runtime for the LanceDB/fastembed async API.
tokio = { version = "1", features = ["full"] }
# Stream consumption for LanceDB query results.
futures-util = "0.3"
# Ergonomic error contexts across lancedb/arrow/fastembed/io error types.
anyhow = "1"
# Stable content-addressed chunk ids (sha256(path:paragraph_index)) — same
# scheme as store::chunk_id so citation ids are reproducible.
sha2 = "0.10"
# Hex-encode/decode for the citation-id digest + (mirroring the app) any
# encrypted-text experiments.
hex = "0.4"
# Citation envelope (de)serialization in the verification test.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Throwaway on-disk LanceDB dataset dir for the demo bin AND the tests. Kept as
# a regular (not dev) dependency so `src/bin/demo.rs` can use it too.
tempfile = "3"
