[package]
name = "docx-roundtrip"
version = "0.0.0"
edition = "2021"
publish = false
description = "DE-RISKING SPIKE: prove in-house OOXML Word track-changes round-trip (Keepance 3.0)."

# This is a STANDALONE spike crate, deliberately NOT wired into the Tauri build
# so `cargo test` here is fast and isolated. The proven code is intended to move
# into src-tauri/src/commands/docx/ for the real WS-A document engine.
#
# "In-house" constraint (board decision): no proprietary OOXML/document SDK and
# no SaaS/cloud document service ever touches the document. Generic XML + ZIP
# crates we compile into our own binary are explicitly allowed.

[dependencies]
# Generic OOXML package container. `zip` gives us read + write of the .docx
# (which is just a ZIP of XML parts). default-features pulls deflate via flate2.
zip = "4"
# Generic streaming XML reader/writer. We use the reader to parse document.xml /
# comments.xml preserving revision + comment markup, and the writer to re-emit
# byte-faithful, well-formed XML.
quick-xml = "0.38"
# Stable ids for new comments / revision ids the AI authors.
uuid = { version = "1", features = ["v4"] }
# Typed dates for w:date attributes on revisions and comments.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Ergonomic error handling across zip/xml/io error types in the spike.
anyhow = "1"

[dev-dependencies]
tempfile = "3"
